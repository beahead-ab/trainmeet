# Körs på varje PR och varje ändring på main: kodstil, typer, testerna och bilderna för
# Hubben, Catalog, TrainMeet ID, TKL och CAD, och Pi-paketet. Alla kontrollerna, "Tester",
# "Hubbens bild", "Catalogs bild", "ID:s bild", "TKL:s bild", "Pi-paketet" och "CAD:s bild", ska
# vara gröna innan en PR slås ihop.
name: Tester

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tester-${{ github.ref }}
  # A newer push replaces an older test run on a PR, but a run on main is never cut off:
  # it may be in the middle of putting the hub out in the test environment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tester:
    name: Tester
    runs-on: ubuntu-latest
    # CAD's image chain (#89 del c1) runs real photos through OpenCV; pytest took 22 minutes in
    # one process, and takes about 8 in four (pytest-xdist, the runner's 4 vCPUs). --durations
    # shows what grew.
    timeout-minutes: 25
    # TrainMeet Catalog's tests need a PostgreSQL of their own (catalog/tests/conftest.py).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: prov
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      CATALOG_TEST_DATABASE_URL: postgresql://postgres:prov@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installera
        run: uv sync --locked

      - name: Kodstil
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Typer
        run: uv run mypy

      # The physical TMBoxes are tried against a real Mosquitto (#74, DRIFT-22).
      - name: Mosquitto
        run: |
          sudo apt-get install -y -q mosquitto \
            || (sudo apt-get update -q && sudo apt-get install -y -q mosquitto)

      # Four processes, one per vCPU. --dist loadfile keeps each test file in one process, so
      # what a file reads once and caches (CAD's photos, the reference stations) is read once.
      # Every test makes its own databases, ports and folders, so the processes share nothing.
      - name: Testerna
        run: uv run pytest -n 4 --dist loadfile --durations=15

      - name: Kontraktens TypeScript-typer
        run: |
          npx --yes openapi-typescript@7.10.1 contracts/openapi.json -o contracts/types.d.ts --check
          npx --yes openapi-typescript@7.10.1 contracts/catalog.openapi.json -o contracts/catalog.d.ts --check
          npx --yes openapi-typescript@7.10.1 contracts/id.openapi.json -o contracts/id.d.ts --check
          npx --yes openapi-typescript@7.10.1 contracts/tkl.openapi.json -o contracts/tkl.d.ts --check
          npx --yes openapi-typescript@7.10.1 contracts/cad.openapi.json -o contracts/cad.d.ts --check

  bilden:
    name: Hubbens bild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Bygg bilden
        run: >
          docker build -f hub/Dockerfile -t trainmeet-hub:prov
          --build-arg TRAINMEET_COMMIT=${{ github.sha }} .

      - name: Starta bilden och prova sidorna
        run: |
          docker run -d --name hub -p 8080:8080 trainmeet-hub:prov
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q "<title>TrainMeet Hub</title>"
          curl -fsSI http://localhost:8080/drift/klienter | grep -qi "content-security-policy: default-src 'self'"
          SCRIPT=$(curl -fsS http://localhost:8080/drift | grep -o '/drift/assets/[^"]*\.js' | head -1)
          curl -fsS "http://localhost:8080$SCRIPT" | grep -q "Öppna Provbanan"
          curl -fsS "http://localhost:8080$SCRIPT" | grep -q "Ingen träff är startad"
          curl -fsS http://localhost:8080/api/version | grep -q '"hub_name":"Hubben"'
          curl -fsS http://localhost:8080/provbanan | grep -q "<title>TrainMeet Hub</title>"
          curl -fsS http://localhost:8080/planering | grep -q "<title>Planering · TrainMeet Hub</title>"
          PLAN=$(curl -fsS http://localhost:8080/planering | grep -o '/planering/assets/[^"]*\.js' | head -1)
          curl -fsS "http://localhost:8080$PLAN" | grep -q "Skapa träffen"
          curl -fsS "http://localhost:8080$SCRIPT" | grep -q "Starta provkörning"
          curl -fsS -H 'Content-Type: application/json' -d '{"version":1}' \
            http://localhost:8080/api/provbanan/start | grep -q '"meet_id":"provbanan"'
          curl -fsS http://localhost:8080/api/version | grep -q '"product":"TrainMeet Hub"'
          curl -fsS http://localhost:8080/planering/provbanan/graf | grep -q "<title>Planering · TrainMeet Hub</title>"
          curl -fsS "http://localhost:8080$PLAN" | grep -q "Lägg till underlag"
          curl -fsS "http://localhost:8080$PLAN" | grep -q "dra i sidled för resten av dygnet"
          docker inspect --format '{{.Config.User}}' hub | grep -qx hub
          # Sidorna i React (H62): appen och dess egna filer, på sin adress och på en av sina sidor.
          curl -fsS http://localhost:8080/skarm | grep -q "TrainMeet · Skärm"
          curl -fsSI http://localhost:8080/skarm/ansluten | grep -qi "content-security-policy: default-src 'self'"
          SCRIPT=$(curl -fsS http://localhost:8080/skarm | grep -o '/skarm/assets/[^"]*\.js' | head -1)
          curl -fsS "http://localhost:8080$SCRIPT" | grep -q "Anslut skärmen"
          curl -fsS http://localhost:8080/box | grep -q "TrainMeet Hub · TMBox"
          curl -fsS http://localhost:8080/provbanan/box | grep -q "TrainMeet Hub · TMBox"
          SCRIPT=$(curl -fsS http://localhost:8080/box | grep -o '/box/assets/[^"]*\.js' | head -1)
          curl -fsS "http://localhost:8080$SCRIPT" | grep -q "Koppla från"

      - name: Belastningsprovet, 40 boxar och 30 stationsklienter (DRIFT-20)
        run: |
          # Hubbens träff med Provbanan: varje box hämtar sin bild varje sekund och varje
          # stationsklient sin ögonblicksbild varannan sekund. Rött om Drift ger ett enda fel
          # eller om p99 är över en sekund.
          curl -fsS -H 'Content-Type: application/json' -d '{"name":"Hubben","pin":"482915"}' \
            http://localhost:8080/api/hub/setup >/dev/null
          python3 deploy/belastning.py --hub http://localhost:8080 --pin 482915 --start \
            --boxes 40 --clients 30 --seconds 20 --strict

      # Lokföraren (#81, LOK-14, LOK-36): appen i bilden på /lokforaren, och webbläsarprovet mot
      # hubbens träff med Provbanan, som belastningsprovet satte upp och startade: två telefoner
      # i Chrome tar tjänster, den andra får beskedet att tjänsten är tagen, och trafikledningen
      # ser Försenad under Förare i Drift (apps/lokforaren/e2e/tva-forare.mjs).
      - name: Node för Lokförarens webbläsarprov
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Lokföraren i bilden och webbläsarprovet (#81)
        timeout-minutes: 5
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PROV_ADRESS: http://localhost:8080
          PROV_PIN: "482915"
          PROV_BILDER: ${{ runner.temp }}/lokforaren
        run: |
          curl -fsS http://localhost:8080/lokforaren/ | grep -q '/lokforaren/assets/'
          curl -fsS http://localhost:8080/lokforaren/korplan | grep -q 'id="root"'
          curl -fsSI http://localhost:8080/lokforaren/jag | grep -qi "content-security-policy: default-src 'self'"
          curl -fsS http://localhost:8080/lokforaren/manifest.webmanifest | grep -q '"scope": "/lokforaren/"'
          curl -fsS http://localhost:8080/lokforaren/sw.js | grep -q 'never stored here'
          SCRIPT=$(curl -fsS http://localhost:8080/lokforaren/ | grep -o '/lokforaren/assets/[^"]*\.js' | head -1)
          curl -fsS "http://localhost:8080$SCRIPT" | grep -q "Börja köra"
          npm ci --no-audit --no-fund
          node apps/lokforaren/e2e/tva-forare.mjs

      - name: Lokförarens skärmbilder om något gick fel
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lokforaren
          path: ${{ runner.temp }}/lokforaren
          if-no-files-found: ignore

      - name: Två hubbar ur bilden, Pi:n följer molnet (Synk, ärende 73)
        run: |
          # Molnet och en Pi på ett eget nät: Pi:n ringer ut till http://moln:8080, som på testmiljöns
          # Låtsas-Pi. Pi:n kopplas med en kod, följer versionen, startar träffen och leder den;
          # molnet följer Pi:ns körning live.
          docker network create synk
          docker run -d --name moln --network synk -p 8090:8080 trainmeet-hub:prov
          docker run -d --name pi --network synk -p 8091:8080 trainmeet-hub:prov
          for port in 8090 8091; do
            for i in $(seq 1 30); do
              curl -fsS "http://localhost:$port/healthz" >/dev/null 2>&1 && break
              sleep 1
            done
          done
          JSON='Content-Type: application/json'
          curl -fsS -c moln.txt -H "$JSON" -d '{"name":"Molnet","pin":"482915"}' http://localhost:8090/api/hub/setup >/dev/null
          curl -fsS -c pi.txt -H "$JSON" -d '{"name":"Pi:n","pin":"482915"}' http://localhost:8091/api/hub/setup >/dev/null
          MOLN=http://localhost:8090/api/planering/1/meets
          curl -fsS -b moln.txt -H "$JSON" -d '{"name":"Värnamo","first_date":"2026-10-30","last_date":"2026-11-01"}' "$MOLN" >/dev/null
          SRC=$(curl -fsS -b moln.txt -H 'Content-Type: application/octet-stream' \
            --data-binary @integrationer/tests/fixtures/varnamo.json.gz "$MOLN/varnamo/sources?name=varnamo.json.gz" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["source"]["id"])')
          curl -fsS -b moln.txt -H "$JSON" -d '{}' "$MOLN/varnamo/sources/$SRC/apply" >/dev/null
          curl -fsS -b moln.txt -H "$JSON" -d '{}' "$MOLN/varnamo/versions" >/dev/null
          CODE=$(curl -fsS -b moln.txt -H "$JSON" -d '{}' http://localhost:8090/api/sync/1/meets/varnamo/code |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["code"])')
          curl -fsS -b pi.txt -H "$JSON" -d "{\"address\":\"http://moln:8080\",\"code\":\"$CODE\"}" \
            http://localhost:8091/api/hub/cloud | grep -q '"versions":1'
          curl -fsS -b pi.txt -H "$JSON" -d '{"meet":"varnamo","version":1}' http://localhost:8091/api/drift/1/start >/dev/null
          sleep 3
          curl -fsS -b moln.txt -H "$JSON" -d '{"meet":"varnamo","version":1}' http://localhost:8090/api/drift/1/start >/dev/null
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8090/api/drift/1/now | grep -q '"hub_name":"Pi:n"' && break
            sleep 1
          done
          curl -fsS http://localhost:8090/api/drift/1/now | grep -q '"hub_name":"Pi:n"'
          echo "Pi:n leder träffen och molnet följer den."
          # Reläet (SYNK-11): en telefon utanför träffens nät ansluter till Pi:n genom molnet.
          # Pi:n säger adressen när en klient ansluter på träffens nät.
          KOD=$(curl -fsS -b pi.txt http://localhost:8091/api/drift/1/connect |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["code"])')
          TEL="{\"kind\":\"tmbox_app\",\"name\":\"Telefonen\",\"software\":\"TMBox\",\"code\":\"$KOD\"}"
          RELA=$(curl -fsS -H "$JSON" -d "$TEL" http://localhost:8091/api/station/1/connect |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["relay"].split(":8080", 1)[1])')
          for i in $(seq 1 20); do
            curl -fsS -H "$JSON" -d "$TEL" "http://localhost:8090$RELA/api/station/1/connect" |
              grep -q '"status":"waiting"' && break
            sleep 1
          done
          curl -fsS -H "$JSON" -d "$TEL" "http://localhost:8090$RELA/api/station/1/connect" |
            grep -q '"status":"waiting"'
          echo "En telefon når Pi:n genom molnets relä."
          # Push (F20): bilden har det som behövs för Apples tjänst, HTTP/2 och den signerade nyckeln.
          docker exec moln /app/.venv/bin/python -c 'import h2, httpx, jwt; from synk.push import ApnsPush'
          echo "Bilden kan skicka push."

      # Anläggning från CAD (#89 del d3, CAD-11, CAD-12): en molnhubb ur bilden loggar in en
      # planerare med en låtsad TrainMeet ID, hämtar den syntetiska anläggningen ur en låtsad
      # TrainMeet CAD med planerarens egen token (hub/prov_cad.py, integrationer/cad_example.py),
      # lägger in den i Värnamos utkast och publicerar. En Pi följer molnet och har anläggningen med
      # modulerna i versionen, byte för byte, utan att fråga CAD. Hubbens PIN ser vägen grå.
      - name: Anläggning från CAD i importen, och Pi:n får modulerna med versionen (#89 del d3)
        timeout-minutes: 3
        run: |
          docker run -d --name latsas --network synk -p 127.0.0.1:8098:8098 trainmeet-hub:prov \
            python -m hub.prov_cad --port 8098 --issuer http://127.0.0.1:8098/realms/trainmeet
          docker run -d --name moln-cad --network synk -p 127.0.0.1:8092:8080 \
            -e TRAINMEET_PUBLIC_URL=http://127.0.0.1:8092 \
            -e TRAINMEET_ID_ISSUER=http://127.0.0.1:8098/realms/trainmeet \
            -e TRAINMEET_ID_INTERNAL=http://latsas:8098/realms/trainmeet \
            -e TRAINMEET_ID_SECRET=prov -e TRAINMEET_ID_API=http://latsas:8098 \
            -e HUB_CAD=http://latsas:8098 trainmeet-hub:prov
          docker run -d --name pi-cad --network synk -p 127.0.0.1:8093:8080 trainmeet-hub:prov
          for port in 8098 8092 8093; do
            for i in $(seq 1 30); do
              curl -fsS "http://127.0.0.1:$port/healthz" >/dev/null 2>&1 && break
              sleep 1
            done
          done
          JSON='Content-Type: application/json'
          MOLN=http://127.0.0.1:8092/api/planering/1/meets
          MEET_ID=00000000-0000-4000-8000-00000000d303
          ANL=00000000-0000-4000-8000-0000000000aa
          curl -fsS -c pin-cad.txt -H "$JSON" -d '{"name":"Molnet","pin":"482915"}' http://127.0.0.1:8092/api/hub/setup >/dev/null
          curl -fsS -c pi-cad.txt -H "$JSON" -d '{"name":"Pi:n","pin":"482915"}' http://127.0.0.1:8093/api/hub/setup >/dev/null
          # Planeraren loggar in med ID: hubben, låtsas-ID och tillbaka med koden.
          curl -fsS -L -c planerare.txt -b planerare.txt -o /dev/null "http://127.0.0.1:8092/api/hub/id/login?next=/planering"
          curl -fsS -b planerare.txt -H "$JSON" \
            -d "{\"name\":\"Provträffen\",\"id_meet\":\"$MEET_ID\",\"first_date\":\"2026-10-30\",\"last_date\":\"2026-11-01\"}" \
            "$MOLN" >/dev/null
          SRC=$(curl -fsS -b planerare.txt -H 'Content-Type: application/octet-stream' \
            --data-binary @integrationer/tests/fixtures/varnamo.json.gz "$MOLN/provtraffen/sources?name=varnamo.json.gz" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["source"]["id"])')
          curl -fsS -b planerare.txt -H "$JSON" -d '{}' "$MOLN/provtraffen/sources/$SRC/apply" >/dev/null
          curl -fsS -b planerare.txt "$MOLN/provtraffen/cad" | grep -q '"available":true'
          curl -fsS -b pin-cad.txt "$MOLN/provtraffen/cad" | grep -q '"available":false'
          CAD=$(curl -fsS -b planerare.txt -H "$JSON" -d '{}' "$MOLN/provtraffen/cad/$ANL" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["source"]["id"])')
          curl -fsS -b planerare.txt -H "$JSON" -d '{}' "$MOLN/provtraffen/sources/$CAD/apply" | grep -q '"cad_assembly"'
          curl -fsS -b pin-cad.txt -H "$JSON" -d '{}' "$MOLN/provtraffen/versions" >/dev/null
          CODE=$(curl -fsS -b pin-cad.txt -H "$JSON" -d '{}' http://127.0.0.1:8092/api/sync/1/meets/provtraffen/code |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["code"])')
          curl -fsS -b pi-cad.txt -H "$JSON" -d "{\"address\":\"http://moln-cad:8080\",\"code\":\"$CODE\"}" \
            http://127.0.0.1:8093/api/hub/cloud | grep -q '"versions":1'
          V=api/planering/1/meets/provtraffen/versions/1/attachments/cad-anlaggning
          curl -fsS "http://127.0.0.1:8093/$V" -o pi-cad.json
          curl -fsS "http://127.0.0.1:8092/$V" -o moln-cad.json
          cmp pi-cad.json moln-cad.json && grep -q '"trainmeet.cad-assembly/1"' pi-cad.json
          echo "Pi:n har anläggningen med modulerna i versionen, utan att fråga CAD."

      - name: Visa loggen om något gick fel
        if: failure()
        run: |
          docker logs hub || true
          docker logs moln || true
          docker logs pi || true
          docker logs moln-cad || true
          docker logs pi-cad || true
          docker logs latsas || true

  # TrainMeet Catalog: webbappens typer och tester körs när bilden byggs. Sedan provas bilden
  # med testmiljöns egen compose-fil: databasen, säkerhetskopian före migreringen, migreringen,
  # TKL i molnet (#76, KLAR-22): webbappens typer och prov, bilden, och första start och PIN-låset
  # i den byggda bilden. Klareringen mot hubben provas i "Tester" (tests/test_tkl_klarering.py).
  tkl:
    name: TKL:s bild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Bygg bilden
        run: >
          docker build -f tkl/Dockerfile -t trainmeet-tkl:prov
          --build-arg TRAINMEET_COMMIT=${{ github.sha }} .

      - name: Starta bilden och prova TKL
        run: |
          docker run -d --name tkl -p 127.0.0.1:8090:8090 \
            -e TKL_HUBBAR=https://hub.invalid trainmeet-tkl:prov
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8090/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8090/api/version | grep -q '"commit":"${{ github.sha }}"'
          curl -fsS http://127.0.0.1:8090/ | grep -q '<title>TrainMeet TKL</title>'
          curl -fsS http://127.0.0.1:8090/studio | grep -q '<title>TrainMeet TKL</title>'
          curl -fsS http://127.0.0.1:8090/api/tkl/1/state | grep -q '"mode":"cloud","software":"TKL'
          # Första start ger en station i den här webbläsaren; en annan har ingen.
          J=$(mktemp)
          curl -fsS -c "$J" -b "$J" -H 'Content-Type: application/json' \
            -d '{"name":"Exempelby","station_id":"exb","pin":"4711"}' \
            http://127.0.0.1:8090/api/tkl/1/setup | grep -q '"unlocked":true'
          curl -fsS -b "$J" http://127.0.0.1:8090/api/tkl/1/studio | grep -q '"station_id":"exb"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/tkl/1/studio)" = 401
          # I molnet bara de hubbar TKL är inställd för, aldrig en adress någon skriver.
          test "$(curl -s -o /dev/null -w '%{http_code}' -b "$J" -H 'Content-Type: application/json' \
            -d '{"address":"http://169.254.169.254"}' http://127.0.0.1:8090/api/tkl/1/connection)" = 422
          curl -fsS -b "$J" http://127.0.0.1:8090/api/tkl/1/hubs | grep -q '"address":"https://hub.invalid"'

      # Ställverket på nivå 1–2 (#84): en hubb med Provbanan ur källkoden och TKL ur bilden på
      # stationens dator, och webbläsarprovet i Chrome. TKL tar referensstationen Gårdsjö, ger
      # klart, lägger en tågväg och en växlingsväg, stegar tåg 102 in på spår 2 och anmäler
      # ankomsten, som Hubben ska ha fått (apps/tkl/e2e/stallverk.mjs).
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Node för TKL:s webbläsarprov
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ställverket på nivå 1–2 i webbläsaren (#84)
        timeout-minutes: 8
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PROV_HUBB: http://127.0.0.1:8080
          PROV_HUBB_I_TKL: http://host.docker.internal:8080
          PROV_TKL: http://127.0.0.1:8091
          PROV_BILDER: ${{ runner.temp }}/tkl
        run: |
          uv sync --locked
          mkdir -p "$RUNNER_TEMP/hubb"
          TRAINMEET_PREVIEW_DB="$RUNNER_TEMP/hubb/prov.db" nohup uv run uvicorn hub.app:app \
            --host 0.0.0.0 --port 8080 > "$RUNNER_TEMP/hubb.log" 2>&1 &
          docker run -d --name tkl-lokal -p 127.0.0.1:8091:8090 -e TKL_MODE=local \
            --add-host=host.docker.internal:host-gateway trainmeet-tkl:prov
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:8091/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          npm ci --no-audit --no-fund
          node apps/tkl/e2e/stallverk.mjs

      # Fjärrstyrning (#36): tre TKL ur bilden mot samma hubb med Provbanan: stationen Åsen med
      # Gårdsjös modell, ett fjärrställverk och en granne. Stationen lämnar över, svarar på
      # vägarna från fjärrbilden och fjärrtågklarerarens Stream Deck, och skickar vidare
      # Rangerbangårdens begäran och Klara att skicka (apps/tkl/e2e/fjarr.mjs).
      - name: Fjärrstyrningen i webbläsaren (#36)
        timeout-minutes: 4
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PROV_HUBB: http://127.0.0.1:8080
          PROV_HUBB_I_TKL: http://host.docker.internal:8080
          PROV_TKL_FJARR: http://127.0.0.1:8093
          PROV_TKL_GRANNE: http://127.0.0.1:8094
          PROV_TKL_STATION: http://127.0.0.1:8095
          PROV_BILDER: ${{ runner.temp }}/tkl/fjarr
        run: |
          docker run -d --name tkl-fjarr -p 127.0.0.1:8093:8090 -e TKL_MODE=local \
            --add-host=host.docker.internal:host-gateway trainmeet-tkl:prov
          docker run -d --name tkl-granne -p 127.0.0.1:8094:8090 -e TKL_MODE=local \
            --add-host=host.docker.internal:host-gateway trainmeet-tkl:prov
          docker run -d --name tkl-station -p 127.0.0.1:8095:8090 -e TKL_MODE=local \
            --add-host=host.docker.internal:host-gateway trainmeet-tkl:prov
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8093/healthz >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:8094/healthz >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:8095/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          node apps/tkl/e2e/fjarr.mjs

      # Rita (#85): en station ritas från ingenting i Chrome mot TKL ur bilden, tas i bruk och får
      # tågvägen A1 → 1Ö i Ställverket (apps/tkl/e2e/rita.mjs). Ingen hubb behövs.
      - name: Rita i webbläsaren (#85)
        timeout-minutes: 3
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PROV_TKL: http://127.0.0.1:8092
          PROV_BILDER: ${{ runner.temp }}/tkl/rita
        run: |
          docker run -d --name tkl-rita -p 127.0.0.1:8092:8090 -e TKL_MODE=local trainmeet-tkl:prov
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8092/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          node apps/tkl/e2e/rita.mjs

      # Ladda upp ritning (#89 del c4): TKL ur bilden loggar in med en låtsad TrainMeet ID och laddar
      # upp den syntetiska signalplanen till en låtsad TrainMeet CAD, som svarar med CAD:s egen
      # avläsning av den (contracts/examples/exempelby.drawing-read.json). Priset, frågorna med
      # teckenförklaringen först, förslaget gult i Rita, Bekräfta och Använd (apps/tkl/e2e/ladda-upp.mjs).
      # Från CAD (#89 del d2): samma låtsade CAD listar en syntetisk anläggning med CAD:s egen spårgraf
      # (cad/assembly_example.py), förslaget blir gult, bekräftas och tas i bruk, CAD får veta stationen,
      # och omimporten efter en ändring i CAD visar skillnaden.
      # Mätbilden under i Foto (#89 del d4): CAD ger modulernas syntetiska mätbilder, som CAD:s egen kod
      # gör (cad/matbild_example.py). TKL hämtar dem med förslaget, och i Foto är Mätbilden under av
      # tills provet slår på den; bilderna ligger där modulerna ligger, och valet står kvar.
      - name: Ladda upp ritning, Från CAD och Mätbilden under i webbläsaren (#89 del c4, d2 och d4)
        timeout-minutes: 4
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PROV_TKL: http://127.0.0.1:8096
          PROV_LATSAS: "8097"
          PROV_BILDER: ${{ runner.temp }}/tkl/ladda-upp
        run: |
          uv run python -m cad.bildkedjan.ritning_syntetisk pdf "$RUNNER_TEMP/ritning.pdf"
          uv run python -m cad.bildkedjan.ritning_syntetisk bild "$RUNNER_TEMP/underlag.png"
          uv run python -m cad.assembly_example "$RUNNER_TEMP/cad-fore.json" "$RUNNER_TEMP/cad-efter.json"
          uv run python -m cad.matbild_example "$RUNNER_TEMP/cad-matbilder"
          docker run -d --name tkl-ladda -p 127.0.0.1:8096:8090 -e TKL_MODE=local \
            -e TKL_ID_ISSUER=http://127.0.0.1:8097/realms/trainmeet \
            -e TKL_ID_INTERNAL=http://host.docker.internal:8097/realms/trainmeet \
            -e TKL_PUBLIC_URL=http://127.0.0.1:8096 -e TKL_CAD=http://host.docker.internal:8097 \
            --add-host=host.docker.internal:host-gateway trainmeet-tkl:prov
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8096/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          PROV_RITNING="$RUNNER_TEMP/ritning.pdf" PROV_UNDERLAG="$RUNNER_TEMP/underlag.png" \
            PROV_CAD_FORE="$RUNNER_TEMP/cad-fore.json" PROV_CAD_EFTER="$RUNNER_TEMP/cad-efter.json" \
            PROV_CAD_MATBILDER="$RUNNER_TEMP/cad-matbilder" node apps/tkl/e2e/ladda-upp.mjs

      - name: TKL:s skärmbilder om något gick fel
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tkl-stallverk
          path: ${{ runner.temp }}/tkl
          if-no-files-found: ignore

      - name: Visa loggen om något gick fel
        if: failure()
        run: |
          docker logs tkl || true
          docker logs tkl-lokal || true
          docker logs tkl-rita || true
          docker logs tkl-ladda || true
          docker logs tkl-fjarr || true
          docker logs tkl-granne || true
          docker logs tkl-station || true
          cat "$RUNNER_TEMP/hubb.log" || true

      # Hubben körs genom uv och håller uv:s cache låst. Den stängs av före jobbets egen städning,
      # som annars väntar på låset tills den ger upp när uv.lock har ändrats (som i ID-jobbet).
      - name: Stäng av provets program
        if: always()
        run: |
          pkill -f "uvicorn hub.app" || true
          for i in $(seq 1 10); do pgrep -f "uvicorn hub.app" >/dev/null || break; sleep 1; done

  # Catalog i läget check, provinloggningen och en säkerhetskopia med data i (CAT-39).
  catalog:
    name: Catalogs bild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROV: /tmp/catalog-testmiljo
    steps:
      - uses: actions/checkout@v4

      - name: Bygg bilden
        run: >
          docker build -f catalog/Dockerfile -t trainmeet-catalog:prov
          --build-arg TRAINMEET_COMMIT=${{ github.sha }} .

      - name: Starta databasen som i testmiljön
        run: |
          mkdir -p "$PROV"
          cp deploy/testmiljo/compose.yaml deploy/testmiljo/catalog-backup.sh "$PROV/"
          cd "$PROV"
          umask 077
          # As up.sh does on the server: Catalog's vault, and its pictures on disk (#51).
          mkdir -p catalog-vault catalog-pictures
          {
            echo "HUB_TAG=prov"
            echo "HUB_DOMAIN=localhost"
            echo "PI_DOMAIN=localhost"
            echo "CATALOG_TAG=prov"
            echo "CATALOG_DOMAIN=localhost"
            echo "CATALOG_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "CATALOG_BACKUP_KEY=$(openssl rand -hex 32)"
            echo "CATALOG_TRIAL_LOGIN=on"
            echo "CATALOG_TAG_BASE=https://localhost/t/"
            echo "TAGS_DOMAIN=localhost"
            # Compose-filen har ID också; provet här startar det inte, men namnen ska finnas.
            echo "ID_TAG=prov"
            echo "ID_DOMAIN=localhost"
            echo "ID_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "ID_ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "ID_CATALOG_SECRET=$(openssl rand -hex 32)"
            echo "ID_APP_SECRET=$(openssl rand -hex 32)"
            echo "ID_HUB_SECRET=$(openssl rand -hex 32)"
            echo "HOST_UID=$(id -u)"
          } > .env
          docker compose up -d --wait catalog-db

      - name: Säkerhetskopian före migreringen, migreringen och Catalog
        run: |
          cd "$PROV"
          # Catalog vägrar starta mot en databas som inte är migrerad.
          if UT=$(timeout 60 docker compose run --rm --no-deps catalog 2>&1); then
            echo "::error::Catalog startade mot en omigrerad databas."; exit 1
          fi
          echo "$UT" | grep -q "saknar migrationer"
          TESTMILJO_DIR="$PROV" sh catalog-backup.sh fore-migrering
          docker compose run --rm --no-deps catalog python -m catalog.migrate
          docker compose run --rm --no-deps catalog python -m catalog.migrate --check
          docker compose up -d --no-deps catalog

      - name: Prova Catalog
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8081/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8081/healthz | grep -qx ok
          curl -fsS http://localhost:8081/api/version | grep -q '"product":"TrainMeet Catalog"'
          curl -fsS http://localhost:8081/api/version | grep -q '"commit":"${{ github.sha }}"'
          curl -fsS http://localhost:8081/ | grep -q "<title>TrainMeet Catalog</title>"
          curl -fsS http://localhost:8081/fordon | grep -q 'id="root"'
          curl -fsS -o /dev/null http://localhost:8081/manifest.webmanifest
          curl -fsS -I http://localhost:8081/fordon | grep -qi "content-security-policy: default-src 'self'"
          curl -fsS http://localhost:8081/api/catalog/1/session | grep -q '"login":"trial"'
          ACCOUNT=$(curl -fsS http://localhost:8081/api/catalog/1/trial/accounts | jq -r '.[0].id')
          curl -fsS -c "$PROV/kakor" -H 'Content-Type: application/json' -d "{\"account\":\"$ACCOUNT\"}" \
            http://localhost:8081/api/catalog/1/trial/login | grep -q '"name":"Provkonto A"'
          curl -fsS -b "$PROV/kakor" http://localhost:8081/api/catalog/1/session | grep -q '"name":"Provkonto A"'
          # En simulerad tagg, som i testmiljön: okänd tills den kopplas (#54).
          TAGG=$(curl -fsS -b "$PROV/kakor" -X POST http://localhost:8081/api/catalog/1/tags/simulated | jq -r .uid)
          curl -fsS -b "$PROV/kakor" "http://localhost:8081/api/catalog/1/tags/$TAGG" | grep -q '"outcome":"unknown"'
          curl -fsS "http://localhost:8081/t/$TAGG" | grep -q 'id="root"'
          # Fordonens bilder (#51): a picture is uploaded, made smaller, and fetched with its
          # signed link, from the server's disk here.
          FORDON=$(curl -fsS -b "$PROV/kakor" -H 'Content-Type: application/json' \
            -d '{"status":"ready","kind":"freight_wagon","litt":"Hbis","number":"21 74 245 2 253-0"}' \
            http://localhost:8081/api/catalog/1/vehicles | jq -r .id)
          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==' | base64 -d > "$PROV/bild.png"
          BILD=$(curl -fsS -b "$PROV/kakor" -H 'Content-Type: image/png' --data-binary @"$PROV/bild.png" \
            "http://localhost:8081/api/catalog/1/vehicles/$FORDON/pictures")
          echo "$BILD" | jq -e '.main == true' >/dev/null
          curl -fsS -o /dev/null "http://localhost:8081$(echo "$BILD" | jq -r .thumb_url)"
          # Catalog runs as the deploy user, never as root, so it can read its key in catalog-vault (#51).
          CATALOG_USER=$(docker inspect --format '{{.Config.User}}' "$(docker compose -f "$PROV/compose.yaml" ps -q catalog)")
          case "$CATALOG_USER" in ""|0|0:*|root|root:*) echo "Catalog kör som root." >&2; exit 1;; esac

      - name: Nattens säkerhetskopia, med data i
        run: |
          cd "$PROV"
          TESTMILJO_DIR="$PROV" sh catalog-backup.sh natt
          ls catalog-backup/*-natt.dump.enc catalog-backup/*-fore-migrering.dump.enc
          # Krypterad: pg_dumps eget huvud (PGDMP) syns inte i filen.
          if head -c 5 catalog-backup/*-natt.dump.enc | grep -q PGDMP; then exit 1; fi

      # Webbläsarprovet (CAT-154): webbappen byggd, och Catalog med sin riktiga kö och en egen
      # PostgreSQL, mot en låtsad TrainMeet ID och en låtsad AI (catalog/prov_webblasare.py). Chrome
      # går igenom Lägg till med foto och Lägg till flera (apps/catalog/e2e/omgang.mjs). Ingen
      # AI-leverantör anropas.
      - name: Node för webbläsarprovet
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: uv för webbläsarprovet
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Webbläsarprovet, med låtsad ID och AI (CAT-154)
        timeout-minutes: 5
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PROV_ADRESS: http://127.0.0.1:8090
        run: |
          docker run -d --rm --name webblasare-db -e POSTGRES_PASSWORD=prov \
            -p 127.0.0.1:5433:5432 postgres:17-alpine
          npm ci --no-audit --no-fund
          npm run build -w apps/catalog
          uv sync --locked
          for i in $(seq 1 60); do
            docker exec webblasare-db pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          uv run python -m catalog.prov_webblasare --ny --port 8090 \
            --databas postgresql://postgres:prov@127.0.0.1:5433/postgres > "$PROV/webblasare.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8090/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          if ! PROV_BILDER="$PROV/webblasare" node apps/catalog/e2e/omgang.mjs; then
            cat "$PROV/webblasare.log"
            exit 1
          fi

      - name: Webbläsarprovets skärmbilder om något gick fel
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webblasarprovet
          path: ${{ env.PROV }}/webblasare
          if-no-files-found: ignore

      - name: Visa loggen om något gick fel
        if: failure()
        run: cd "$PROV" && docker compose logs || true

      # Webbläsarprovets Catalog körs genom uv och håller uv:s cache låst. Den stängs av före
      # jobbets egen städning, som annars väntar på låset tills den ger upp (som i ID-jobbet).
      - name: Stäng av provets program
        if: always()
        run: |
          pkill -f "catalog.prov_webblasare" || true
          for i in $(seq 1 10); do pgrep -f "catalog.prov_webblasare" >/dev/null || break; sleep 1; done

  # Lägger ut hubben på test.hub.trainmeet.app när en ändring har slagits ihop med main
  # och båda kontrollerna är gröna. Servern skapas första gången (deploy/testmiljo.py).
  # TrainMeet ID: tilläggets tester körs när bilden byggs. Sedan provas inloggningen med en kod
  # till e-posten mot en riktig Keycloak och PostgreSQL, med en låtsad mejlserver, och genom
  # Catalog in med samma konto (#66).
  id:
    name: ID:s bild
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Maven Central svarar ibland inte byggmaskinerna. Tilläggets beroenden sparas därför i
      # GitHubs cache mellan körningarna, och hämtas bara på nytt när pom.xml ändras.
      - uses: docker/setup-buildx-action@v3

      - name: Bygg ID:s bild med Mavens beroenden ur cachen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: id/Dockerfile
          tags: trainmeet-id:prov
          load: true
          build-args: TRAINMEET_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=id
          cache-to: type=gha,mode=max,scope=id

      - name: Bygg bilderna
        run: |
          docker build -f id/api.Dockerfile -t trainmeet-idapi:prov --build-arg TRAINMEET_COMMIT=${{ github.sha }} .

      - name: Starta ID med databas och en låtsad mejlserver
        run: |
          uv sync --locked
          # Mejlservern kräver inloggning, som Scaleways, med ett lösenord som ID läser ur valvet.
          mkdir -p "$RUNNER_TEMP/valv"
          LOSEN=$(openssl rand -hex 16)
          printf '%s' "$LOSEN" > "$RUNNER_TEMP/valv/trainmeet_smtp-password"
          POSTLADA_ANVANDARE=prov-projekt POSTLADA_LOSENORD="$LOSEN" \
            nohup uvx --from aiosmtpd python id/postlada.py "$RUNNER_TEMP/mejl.txt" 2525 > "$RUNNER_TEMP/postlada.log" 2>&1 &
          docker run -d --name id-db --network host -e POSTGRES_DB=keycloak -e POSTGRES_USER=keycloak \
            -e POSTGRES_PASSWORD=prov postgres:17-alpine
          for i in $(seq 1 30); do docker exec id-db pg_isready -U keycloak >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name id --network host -v "$RUNNER_TEMP/valv:/opt/keycloak/vault:ro" \
            -e KC_DB_URL=jdbc:postgresql://127.0.0.1:5432/keycloak -e KC_DB_USERNAME=keycloak -e KC_DB_PASSWORD=prov \
            -e KC_HOSTNAME=http://127.0.0.1:8080 -e KC_BOOTSTRAP_ADMIN_USERNAME=tm-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 16)" \
            -e ID_SMTP_HOST=127.0.0.1 -e ID_SMTP_PORT=2525 -e ID_SMTP_SSL=false -e ID_SMTP_STARTTLS=false \
            -e ID_SMTP_AUTH=true -e ID_SMTP_USER=prov-projekt -e ID_SMTP_FROM=konto@trainmeet.se \
            -e ID_CATALOG_SECRET=prov-hemlighet -e ID_CATALOG_URL=http://localhost:8001 \
            -e ID_APP_SECRET=id-hemlighet -e ID_PUBLIC_URL=http://localhost:8002 \
            -e ID_HUB_SECRET=hub-hemlighet -e ID_HUB_URL=http://localhost:8003 \
            -e ID_TKL_URL=https://tkl.example.test \
            -e ID_CAD_SECRET=cad-hemlighet -e ID_CAD_URL=http://localhost:8004 \
            trainmeet-id:prov
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:9000/health/ready >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:9000/health/ready
          docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' id | grep -qx "${{ github.sha }}"

      # ID:s API och webbapp (#67) ur sin egen bild, med en egen databas och samma mejlserver.
      - name: Starta ID:s API
        run: |
          docker exec id-db createdb -U keycloak idapi
          docker run -d --name id-api --network host -v "$RUNNER_TEMP/valv:/vault:ro" \
            -e ID_API_DATABASE_URL=postgresql://keycloak:prov@127.0.0.1:5432/idapi \
            -e ID_API_ISSUER=http://127.0.0.1:8080/realms/trainmeet -e ID_API_SECRET=id-hemlighet \
            -e ID_API_PUBLIC_URL=http://localhost:8002 \
            -e ID_SMTP_HOST=127.0.0.1 -e ID_SMTP_PORT=2525 -e ID_SMTP_SSL=false -e ID_SMTP_STARTTLS=false \
            -e ID_SMTP_AUTH=true -e ID_SMTP_USER=prov-projekt -e ID_SMTP_PASSWORD_FILE=/vault/trainmeet_smtp-password \
            -e ID_SUPPORT_ADDRESS=support@example.com \
            -e ID_API_CATALOG=http://127.0.0.1:8001 -e ID_API_APPS=catalog,hub \
            --user "$(id -u):0" \
            trainmeet-idapi:prov uvicorn id.app:app --host 127.0.0.1 --port 8002 --no-access-log
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8002/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8002/api/version | grep -q "\"commit\":\"${{ github.sha }}\""

      - name: Starta Catalog mot ID
        run: |
          docker exec id-db createdb -U keycloak catalog
          CATALOG_DATABASE_URL=postgresql://keycloak:prov@127.0.0.1:5432/catalog CATALOG_MIGRATE=auto \
          CATALOG_ID_ISSUER=http://127.0.0.1:8080/realms/trainmeet CATALOG_ID_SECRET=prov-hemlighet \
          CATALOG_PUBLIC_URL=http://localhost:8001 CATALOG_ID_API=http://127.0.0.1:8002 \
          CATALOG_ID_WEB=http://localhost:8002 \
            nohup uv run uvicorn catalog.app:app --port 8001 --no-access-log > "$RUNNER_TEMP/catalog.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8001/healthz

      # Hubben med klienten hub (#78), som i testmiljön.
      - name: Starta Hubben mot ID
        run: |
          mkdir -p "$RUNNER_TEMP/hubb"
          TRAINMEET_PREVIEW_DB="$RUNNER_TEMP/hubb/provbanan.sqlite3" \
          TRAINMEET_ID_ISSUER=http://127.0.0.1:8080/realms/trainmeet TRAINMEET_ID_SECRET=hub-hemlighet \
          TRAINMEET_PUBLIC_URL=http://localhost:8003 TRAINMEET_ID_API=http://127.0.0.1:8002 \
            nohup uv run uvicorn hub.app:app --port 8003 --no-access-log > "$RUNNER_TEMP/hubb.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8003/api/hub >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8003/api/hub | grep -q '"id_login":true'

      # TKL med ID (#78, TKL18): the public client tkl, saving the station in the hub (SYNK-30).
      # TKL runs at the station's own computer's address, http://localhost:8090, which the realm
      # allows as is; ID_TKL_URL above is the test environment's TKL and is not used here.
      - name: Starta TKL mot ID och Hubben
        run: |
          mkdir -p "$RUNNER_TEMP/tkl"
          TKL_DATA_DIR="$RUNNER_TEMP/tkl" TKL_MODE=local \
          TKL_ID_ISSUER=http://127.0.0.1:8080/realms/trainmeet TKL_PUBLIC_URL=http://localhost:8090 \
          TKL_MOLNHUBB=http://127.0.0.1:8003 \
            nohup uv run uvicorn tkl.app:from_environment --factory --port 8090 --no-access-log > "$RUNNER_TEMP/tkl.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8090/healthz

      # Från ID:s sida som Catalog, och sedan genom Catalog och Hubben som en webbläsare (KONTO-27).
      - name: Logga in med en kod till e-posten, också i Catalog och Hubben
        run: >
          uv run python -m id.prov_inloggning http://127.0.0.1:8080 "$RUNNER_TEMP/mejl.txt"
          prov-hemlighet http://localhost:8001 --catalog --id-app=http://localhost:8002
          --hub=http://localhost:8003 --tkl=http://localhost:8090

      # TKL i molnet (#88, TKL5): stationen hör till kontot. Den lokala TKL ger plats; TKL i molnet
      # tar port 8090 på http://127.0.0.1:8090, som realmen tillåter för klienten tkl. Provet loggar
      # in med en kod, gör en station, sparar version 2 i Synk och öppnar den i en ny webbläsare.
      - name: TKL i molnet med ID och Synk
        run: |
          pkill -f "uvicorn tkl.app" || true
          for i in $(seq 1 10); do pgrep -f "uvicorn tkl.app" >/dev/null || break; sleep 1; done
          mkdir -p "$RUNNER_TEMP/tkl-moln"
          TKL_DATA_DIR="$RUNNER_TEMP/tkl-moln" TKL_MODE=cloud TKL_KONTO=on TKL_HUBBAR=http://127.0.0.1:8003 \
          TKL_ID_ISSUER=http://127.0.0.1:8080/realms/trainmeet TKL_PUBLIC_URL=http://127.0.0.1:8090 \
            nohup uv run uvicorn tkl.app:from_environment --factory --port 8090 --no-access-log > "$RUNNER_TEMP/tkl-moln.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/healthz >/dev/null 2>&1 && break; sleep 1; done
          uv run python -m id.prov_inloggning http://127.0.0.1:8080 "$RUNNER_TEMP/mejl.txt" \
            prov-hemlighet http://localhost:8001 --tkl-moln=http://127.0.0.1:8090

      - name: Visa loggen om något gick fel
        if: failure()
        run: |
          docker logs id 2>&1 | tail -100 || true
          docker logs id-api 2>&1 | tail -50 || true
          cat "$RUNNER_TEMP/postlada.log" || true
          cat "$RUNNER_TEMP/catalog.log" || true
          cat "$RUNNER_TEMP/hubb.log" || true
          cat "$RUNNER_TEMP/tkl.log" || true
          cat "$RUNNER_TEMP/tkl-moln.log" || true

      # Mejlservern och Catalog körs genom uv och håller uv:s cache låst. De stängs av före
      # jobbets egen städning, som annars väntar på låset tills den ger upp.
      - name: Stäng av provets program
        if: always()
        run: |
          pkill -f "id/postlada.py" || true
          pkill -f "uvicorn catalog.app" || true
          pkill -f "uvicorn hub.app" || true
          pkill -f "uvicorn tkl.app" || true
          for i in $(seq 1 10); do pgrep -f "id/postlada.py|uvicorn catalog.app|uvicorn hub.app|uvicorn tkl.app" >/dev/null || break; sleep 1; done

  # Pi-paketet (steg 5, DRIFT-20): hubben för en Raspberry Pi, som tjänster i systemd utan
  # containrar. Samma sidor och samma låsta beroenden som bilden. Paketet installeras och startas
  # här som Pi:n gör det, och på main läggs det i den rullande utgåvan pi-senaste, som Pi:ns
  # installation och uppdatering hämtar (deploy/pi/install.sh).
  pi:
    name: Pi-paketet
    needs: [tester, bilden]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Bygg paketet
        run: |
          mkdir -p package/wheel package/web package/pi
          # The web apps from the image's own first stage: built, typed and tested there.
          docker build -f hub/Dockerfile --target web -t trainmeet-web:pi .
          docker create --name web trainmeet-web:pi >/dev/null
          for app in skarmar tmbox-webb trafikledning planering lokforaren; do
            docker cp "web:/src/apps/$app/dist" "package/web/$app"
          done
          docker rm web >/dev/null
          uv build --wheel -o package/wheel
          # The hub's locked dependencies, with their hashes: the Pi installs exactly these.
          uv export --frozen --no-emit-project --no-default-groups --group push \
            --no-header --format requirements-txt -o package/requirements.txt
          cp deploy/pi/* package/pi/
          git rev-parse --short=12 HEAD > package/BUILD
          {
            echo "TRAINMEET_COMMIT=$(git rev-parse --short=12 HEAD)"
            echo "TRAINMEET_BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > package/build.env
          tar -czf trainmeet-hub-pi.tar.gz package
          sha256sum trainmeet-hub-pi.tar.gz > trainmeet-hub-pi.tar.gz.sha256
          cp package/BUILD BUILD
          ls -l trainmeet-hub-pi.tar.gz

      - name: Installera och starta paketet som Pi:n gör
        run: |
          sudo apt-get install -y -q mosquitto \
            || (sudo apt-get update -q && sudo apt-get install -y -q mosquitto)
          python3 -m venv /tmp/pi
          /tmp/pi/bin/pip install --quiet --disable-pip-version-check --require-hashes -r package/requirements.txt
          /tmp/pi/bin/pip install --quiet --disable-pip-version-check --no-deps package/wheel/*.whl
          mkdir -p /tmp/pi-data
          set -a; . package/build.env; set +a
          TRAINMEET_PREVIEW_DB=/tmp/pi-data/p.sqlite3 HUB_WEB_DIR="$PWD/package/web" \
            TRAINMEET_MQTT_HOST=127.0.0.1 TRAINMEET_TMBOX_ANNOUNCE=0 \
            /tmp/pi/bin/uvicorn hub.app:app --port 8099 > /tmp/pi.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8099/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8099/ | grep -q "<title>TrainMeet Hub</title>"
          curl -fsS http://localhost:8099/planering | grep -q "Planering · TrainMeet Hub"
          curl -fsS http://localhost:8099/lokforaren/ | grep -q '/lokforaren/assets/'
          curl -fsS http://localhost:8099/api/version | grep -q "\"commit\":\"$(cat package/BUILD)\""
          curl -sS http://localhost:8099/api/hub/wifi -o /dev/null -w '%{http_code}' | grep -q 401
          # A TMBox over MQTT, as on the Pi: Mosquitto beside the hub (#74, DRIFT-22).
          curl -fsS -c /tmp/pi-jar -H 'Content-Type: application/json' \
            -d '{"name":"Pi:n","pin":"482915"}' http://localhost:8099/api/hub/setup >/dev/null
          curl -fsS -b /tmp/pi-jar -H 'Content-Type: application/json' -d '{"version":1}' \
            http://localhost:8099/api/drift/1/start >/dev/null
          /tmp/pi/bin/python deploy/tmbox_prov.py --box prov-1 --seconds 1 --strict
          curl -fsS -b /tmp/pi-jar http://localhost:8099/api/drift/1/clients | grep -q '"kind":"tmbox"'
          /tmp/pi/bin/python -c "import synk.network_host, synk.push, hub.pin"
          sh -n package/pi/install.sh
          echo "Pi-paketet installeras, startar och visar sidorna."

      - name: Visa loggen om något gick fel
        if: failure()
        run: cat /tmp/pi.log || true

      - name: Lägg ut paketet i pi-senaste
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pi-senaste >/dev/null 2>&1 || gh release create pi-senaste \
            --prerelease --target main --title "Pi-paketet, senaste" \
            --notes "TrainMeet Hub för en Raspberry Pi, byggd från main. Hämta install.sh och kör sudo sh install.sh. Hubben uppdaterar sig sedan från den här utgåvan, på knapptryck under kugghjulet."
          gh release upload pi-senaste trainmeet-hub-pi.tar.gz trainmeet-hub-pi.tar.gz.sha256 \
            BUILD deploy/pi/install.sh --clobber

  # TrainMeet CAD (#89): webbappens typer och tester körs när bilden byggs. Sedan provas bilden
  # med testmiljöns compose-fil och en egen PostgreSQL, som Catalog: CAD vägrar starta mot en
  # omigrerad databas, säkerhetskopian tas och provas före migreringen och en natt med data i.
  # Sist webbläsarprovet: provinloggningen, en rak modul och en kurvmodul ur bara mått, Godkänn
  # och biblioteket, mot en låtsad TrainMeet ID (cad/prov_webblasare.py). Del c2 lägger till en
  # kurvmodul ur ett syntetiskt foto, med gavel A vald i fotot, och en modul ur en syntetisk skiss.
  cad:
    name: CAD:s bild
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROV: /tmp/cad-testmiljo
    steps:
      - uses: actions/checkout@v4

      - name: Bygg bilden
        run: >
          docker build -f cad/Dockerfile -t trainmeet-cad:prov
          --build-arg TRAINMEET_COMMIT=${{ github.sha }} .

      - name: Starta databasen som i testmiljön
        run: |
          mkdir -p "$PROV"
          cp deploy/testmiljo/compose.yaml deploy/testmiljo/cad-backup.sh "$PROV/"
          cd "$PROV"
          # CAD:s modulfoton (#89 del c1): utan hink ligger de på disken, som i testmiljön, där
          # up.sh gör mapparna som deploy-användaren som CAD körs som.
          mkdir -p cad-vault cad-photos
          umask 077
          {
            # Compose-filen har de andra tjänsterna också; provet här startar bara CAD, men
            # namnen ska finnas.
            echo "HUB_TAG=prov"
            echo "HUB_DOMAIN=localhost"
            echo "PI_DOMAIN=localhost"
            echo "CATALOG_TAG=prov"
            echo "CATALOG_DOMAIN=localhost"
            echo "CATALOG_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "CATALOG_TRIAL_LOGIN=on"
            echo "CATALOG_TAG_BASE=https://localhost/t/"
            echo "TAGS_DOMAIN=localhost"
            echo "ID_TAG=prov"
            echo "ID_DOMAIN=localhost"
            echo "ID_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "ID_ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "ID_CATALOG_SECRET=$(openssl rand -hex 32)"
            echo "ID_APP_SECRET=$(openssl rand -hex 32)"
            echo "ID_HUB_SECRET=$(openssl rand -hex 32)"
            echo "HOST_UID=$(id -u)"
            # CAD, med profilen cad som up.sh slår på när hemligheterna finns.
            echo "COMPOSE_PROFILES=cad"
            echo "CAD_TAG=prov"
            echo "CAD_DOMAIN=localhost"
            echo "CAD_TRIAL_LOGIN=on"
            echo "CAD_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "CAD_BACKUP_KEY=$(openssl rand -hex 32)"
            echo "ID_CAD_SECRET=$(openssl rand -hex 32)"
          } > .env
          docker compose up -d --wait cad-db

      - name: Säkerhetskopian före migreringen, migreringen och CAD
        run: |
          cd "$PROV"
          # CAD vägrar starta mot en databas som inte är migrerad.
          if UT=$(timeout 60 docker compose run --rm --no-deps cad 2>&1); then
            echo "::error::CAD startade mot en omigrerad databas."; exit 1
          fi
          echo "$UT" | grep -q "saknar migrationer"
          TESTMILJO_DIR="$PROV" sh cad-backup.sh fore-migrering
          docker compose run --rm --no-deps cad python -m cad.migrate
          docker compose run --rm --no-deps cad python -m cad.migrate --check
          docker compose up -d --no-deps cad

      - name: Prova CAD
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8086/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8086/healthz | grep -qx ok
          curl -fsS http://localhost:8086/api/version | grep -q '"product":"TrainMeet CAD"'
          curl -fsS http://localhost:8086/api/version | grep -q '"commit":"${{ github.sha }}"'
          curl -fsS http://localhost:8086/ | grep -q "<title>TrainMeet CAD</title>"
          curl -fsS http://localhost:8086/moduler/ny | grep -q 'id="root"'
          curl -fsS -o /dev/null http://localhost:8086/manifest.webmanifest
          curl -fsS -I http://localhost:8086/moduler | grep -qi "content-security-policy: default-src 'self'"
          curl -fsS http://localhost:8086/api/cad/1/session | grep -q '"login":"trial"'
          ACCOUNT=$(curl -fsS http://localhost:8086/api/cad/1/trial/accounts | jq -r '.[0].id')
          curl -fsS -c "$PROV/kakor" -H 'Content-Type: application/json' -d "{\"account\":\"$ACCOUNT\"}" \
            http://localhost:8086/api/cad/1/trial/login | grep -q '"name":"Provkonto A"'
          # En rak modul ur bara mått, med MMM:s gavel 140 mm från Kant 1 (CAD-01, CAD-22).
          MODUL=$(curl -fsS -b "$PROV/kakor" -H 'Content-Type: application/json' \
            -d '{"name":"Linje 1500","scale":"H0","shape":{"kind":"straight","length":1500,"width":500},"gables":[{"end":"A","profile":"h0-mmm-enkelspar","tracks":[140]},{"end":"B","profile":"h0-mmm-enkelspar","tracks":[140]}]}' \
            http://localhost:8086/api/cad/1/modules)
          echo "$MODUL" | jq -e '.number == "M-001" and .graph.complete and (.graph.pieces | length) == 1' >/dev/null
          ID=$(echo "$MODUL" | jq -r .id)
          curl -fsS -b "$PROV/kakor" http://localhost:8086/api/cad/1/modules | jq -e '.modules | length == 1' >/dev/null
          curl -fsS -b "$PROV/kakor" -H 'Content-Type: application/json' -d '{"version":1}' \
            "http://localhost:8086/api/cad/1/modules/$ID/approve" | jq -e '.status == "approved"' >/dev/null
          # Exportera (#89 del d1): modulens DXF hämtas och börjar med DXF:s huvud.
          curl -fsS -b "$PROV/kakor" -o "$PROV/modul.dxf" "http://localhost:8086/api/cad/1/modules/$ID/export/1/modul.dxf"
          head -4 "$PROV/modul.dxf" | tr -d ' \r' | paste -sd, - | grep -qx '0,SECTION,2,HEADER'
          # Anläggningar (#89 del d2): en andra godkänd modul, en anläggning med de två gavel mot gavel,
          # och spårgrafen Till TKL Studio, ihopskarvad med modulernas id.
          ANDRA=$(curl -fsS -b "$PROV/kakor" -H 'Content-Type: application/json' \
            -d '{"name":"Linje 1000","scale":"H0","shape":{"kind":"straight","length":1000,"width":500},"gables":[{"end":"A","profile":"h0-mmm-enkelspar","tracks":[140]},{"end":"B","profile":"h0-mmm-enkelspar","tracks":[140]}]}' \
            http://localhost:8086/api/cad/1/modules | jq -r .id)
          curl -fsS -b "$PROV/kakor" -H 'Content-Type: application/json' -d '{"version":1}' \
            "http://localhost:8086/api/cad/1/modules/$ANDRA/approve" >/dev/null
          ANL=$(curl -fsS -b "$PROV/kakor" -H 'Content-Type: application/json' -d '{"name":"Provanläggning","scale":"H0"}' \
            http://localhost:8086/api/cad/1/assemblies | jq -r .id)
          curl -fsS -b "$PROV/kakor" -X PUT -H 'Content-Type: application/json' \
            -d "{\"base\":1,\"name\":\"Provanläggning\",\"modules\":[{\"module\":\"$ID\"},{\"module\":\"$ANDRA\"}],\"joints\":[{\"a\":{\"module\":\"$ID\",\"gable\":\"B\"},\"b\":{\"module\":\"$ANDRA\",\"gable\":\"A\"}}]}" \
            "http://localhost:8086/api/cad/1/assemblies/$ANL" | jq -e '.checks[0].fits and .problems == [] and .modules[1].at == [1500,0]' >/dev/null
          curl -fsS -b "$PROV/kakor" "http://localhost:8086/api/cad/1/studio/assembly/$ANL" \
            | jq -e '.source.ready and (.graph.pieces | length) == 2 and (.graph.nodes | length) == 3' >/dev/null
          # Mätbilden i TKL:s Foto (#89 del d4): modulerna är inte fotade, så båda står bland dem utan
          # mätbild, med H0:s spårvidd.
          curl -fsS -b "$PROV/kakor" "http://localhost:8086/api/cad/1/studio/assembly/$ANL/images" \
            | jq -e '.images == [] and (.missing | length) == 2 and .gauge == 16.5' >/dev/null
          # Import från AnyRail (#91): en syntetisk AnyRail 2.0-export (cad/tests/anyrail_syntetisk.py,
          # bara standardbiblioteket) läses i bilden till sex moduler och fyra växlar, en antagen,
          # och hela stationens DXF hämtas.
          python3 -c 'import sys; sys.path.insert(0, "."); from cad.tests.anyrail_syntetisk import station_xml; open(sys.argv[1], "wb").write(station_xml())' "$PROV/anyrail.xml"
          AR=$(curl -fsS -b "$PROV/kakor" -F 'data={"name":"Exempelstation.xml"};type=application/json' \
            -F "file=@$PROV/anyrail.xml;type=application/xml" http://localhost:8086/api/cad/1/anyrail)
          echo "$AR" | jq -e '(.modules | length) == 6 and .stats.switches == 4 and .stats.assumed == 1' >/dev/null
          curl -fsS -b "$PROV/kakor" -o "$PROV/anyrail.dxf" \
            "http://localhost:8086/api/cad/1/anyrail/$(echo "$AR" | jq -r .id)/files/anlaggning.dxf"
          head -4 "$PROV/anyrail.dxf" | tr -d ' \r' | paste -sd, - | grep -qx '0,SECTION,2,HEADER'
          # CAD runs as its own user, never as root.
          CAD_USER=$(docker inspect --format '{{.Config.User}}' "$(docker compose -f "$PROV/compose.yaml" ps -q cad)")
          case "$CAD_USER" in ""|0|0:*|root|root:*) echo "CAD kör som root." >&2; exit 1;; esac

      - name: Bildkedjan i bilden (#89 del c1, c2 och c4)
        run: |
          cd "$PROV"
          # OpenCV och bildkedjan i bilden: ett syntetiskt foto görs och tas in där, och fotona
          # hamnar på disken i cad-photos när det inte finns någon hink.
          docker compose exec -T cad python -m cad.bildkedjan.syntetisk rak /tmp/rak.jpg
          docker compose exec -T cad sh -c 'test -w /photos'
          docker compose cp cad:/tmp/rak.jpg rak.jpg
          JOBB=$(curl -fsS -b kakor -F 'data={"name":"Fotomodul","scale":"H0","kind":"straight","width":480};type=application/json' \
            -F 'images=@rak.jpg;type=image/jpeg' http://localhost:8086/api/cad/1/photos)
          echo "$JOBB" | jq -e '.state == "corners" and .corners.found and (.photos | length) == 1' >/dev/null
          # Originalet sparas utan kamerans data och plats.
          ORIGINAL=$(echo "$JOBB" | jq -r '.photos[0].url')
          curl -fsS -b kakor -o original.jpg "http://localhost:8086$ORIGINAL"
          if grep -q 'Exif' original.jpg; then echo "Originalet har kvar sin EXIF." >&2; exit 1; fi
          ls cad-photos/*/ | grep -q '\.jpg$'
          # Del c2: en kurvmodul ur ett foto, med kordan och pilhöjden på spår 1; hörnen hittas
          # längs bågarna.
          docker compose exec -T cad python -m cad.bildkedjan.syntetisk kurvmodul /tmp/kurva.jpg
          docker compose cp cad:/tmp/kurva.jpg kurva.jpg
          KURVA=$(curl -fsS -b kakor -F 'data={"name":"Kurvmodul","scale":"H0","kind":"curve","width":400,"chord":645.96,"sagitta":28.26,"track1":140};type=application/json' \
            -F 'images=@kurva.jpg;type=image/jpeg' http://localhost:8086/api/cad/1/photos)
          echo "$KURVA" | jq -e '.state == "corners" and .corners.found' >/dev/null
          # Och Från skiss: en syntetisk skiss med två modulramar, vars ramar hittas.
          docker compose exec -T cad python -m cad.bildkedjan.syntetisk skiss /tmp/skiss.jpg
          docker compose cp cad:/tmp/skiss.jpg skiss.jpg
          SKISS=$(curl -fsS -b kakor -F 'data={"profile":"skiss","name":"Skissmodul","scale":"H0","kind":"straight","width":600,"length":1500};type=application/json' \
            -F 'images=@skiss.jpg;type=image/jpeg' http://localhost:8086/api/cad/1/photos)
          echo "$SKISS" | jq -e '.profile == "skiss" and .state == "corners" and (.frames | length) == 2' >/dev/null
          # Del c4: Ladda upp ritning. En syntetisk signalplan som vektor-PDF tas in, läses gratis av
          # koden (R1) i bildens ritningskö, och underlaget ritas med bildens typsnitt.
          docker compose exec -T cad python -m cad.bildkedjan.ritning_syntetisk pdf /tmp/ritning.pdf
          docker compose cp cad:/tmp/ritning.pdf ritning.pdf
          RITNING=$(curl -fsS -b kakor -F 'file=@ritning.pdf;type=application/pdf' \
            http://localhost:8086/api/cad/1/drawings)
          echo "$RITNING" | jq -e '.state == "waiting" and .pages[0].kind == "vector" and .price.tokens == 0' >/dev/null
          RID=$(echo "$RITNING" | jq -r .id)
          curl -fsS -b kakor -H 'Content-Type: application/json' -d '{"page":1}' \
            "http://localhost:8086/api/cad/1/drawings/$RID/read" | jq -e '.state == "queued"' >/dev/null
          for i in $(seq 1 30); do
            STATE=$(curl -fsS -b kakor "http://localhost:8086/api/cad/1/drawings/$RID" | jq -r .state)
            [ "$STATE" = done ] && break
            sleep 1
          done
          curl -fsS -b kakor "http://localhost:8086/api/cad/1/drawings/$RID" \
            | jq -e '.read.summary.switches == 5 and .read.summary.signals == 7 and .read.summary.boundaries == 9' >/dev/null
          curl -fsS -b kakor -o underlag.png "http://localhost:8086/api/cad/1/drawings/$RID/underlay"
          head -c 4 underlag.png | grep -q PNG

      - name: Nattens säkerhetskopia, med data i
        run: |
          cd "$PROV"
          TESTMILJO_DIR="$PROV" sh cad-backup.sh natt
          ls cad-backup/*-natt.dump.enc cad-backup/*-fore-migrering.dump.enc
          # Krypterad: pg_dumps eget huvud (PGDMP) syns inte i filen.
          if head -c 5 cad-backup/*-natt.dump.enc | grep -q PGDMP; then exit 1; fi

      - name: Node för webbläsarprovet
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: uv för webbläsarprovet
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # bibliotek.mjs kör också CAD i mobilen (#90, mobil.mjs): QR-koden på datorn och flödet i en
      # telefon i en egen Chrome med en låtsad kamera (cad/prov_kamera.py), ungefär en minut till,
      # och Import från AnyRail med en syntetisk fil (#91, anyrail.mjs), några sekunder.
      - name: Webbläsarprovet, med låtsad ID (#89), CAD i mobilen (#90) och AnyRail (#91)
        timeout-minutes: 10
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PROV_ADRESS: http://127.0.0.1:8095
        run: |
          docker run -d --rm --name cad-webblasare-db -e POSTGRES_PASSWORD=prov \
            -p 127.0.0.1:5434:5432 postgres:17-alpine
          npm ci --no-audit --no-fund
          npm run build -w apps/cad
          uv sync --locked
          for i in $(seq 1 60); do
            docker exec cad-webblasare-db pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1 && break
            sleep 1
          done
          uv run python -m cad.prov_webblasare --ny --port 8095 \
            --databas postgresql://postgres:prov@127.0.0.1:5434/postgres > "$PROV/webblasare.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8095/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          if ! PROV_BILDER="$PROV/webblasare" node apps/cad/e2e/bibliotek.mjs; then
            cat "$PROV/webblasare.log"
            exit 1
          fi

      - name: Webbläsarprovets skärmbilder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-webblasarprovet
          path: ${{ env.PROV }}/webblasare
          if-no-files-found: ignore

      - name: Visa loggen om något gick fel
        if: failure()
        run: cd "$PROV" && docker compose logs || true

      # Webbläsarprovets CAD körs genom uv och håller uv:s cache låst. Den stängs av före
      # jobbets egen städning, som annars väntar på låset tills den ger upp (som i Catalog-jobbet).
      - name: Stäng av provets program
        if: always()
        run: |
          pkill -f "cad.prov_webblasare" || true
          for i in $(seq 1 10); do pgrep -f "cad.prov_webblasare" >/dev/null || break; sleep 1; done

  testmiljon:
    name: Testmiljön
    needs: [tester, bilden, catalog, id, tkl, cad]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: testmiljon
      cancel-in-progress: false
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      TESTMILJO_TYPE: ${{ vars.TESTMILJO_TYPE }}
      DOMAIN: ${{ vars.TESTHUB_DOMAIN || 'test.hub.trainmeet.app' }}
      CATALOG_DOMAIN: ${{ vars.TESTCATALOG_DOMAIN || 'test.catalog.trainmeet.app' }}
      ID_DOMAIN: ${{ vars.TESTID_DOMAIN || 'test.id.trainmeet.app' }}
      PI_DOMAIN: ${{ vars.TESTPI_DOMAIN || 'test.pi.trainmeet.app' }}
      TKL_DOMAIN: ${{ vars.TESTTKL_DOMAIN || 'test.tkl.trainmeet.app' }}
      CAD_DOMAIN: ${{ vars.TESTCAD_DOMAIN || 'test.cad.trainmeet.app' }}
      TAGS_DOMAIN: ${{ vars.TESTTAGS_DOMAIN || 'trainmeet.app' }}
      TAG: ${{ github.sha }}
    steps:
      - name: Finns Scaleway-nyckeln?
        id: nyckel
        run: |
          if [ -n "$SCW_SECRET_KEY" ] && [ -n "$SCW_ACCESS_KEY" ] && [ -n "$SCW_DEFAULT_PROJECT_ID" ] && [ -n "$SCW_DEFAULT_ORGANIZATION_ID" ]; then
            echo "finns=true" >> "$GITHUB_OUTPUT"
          else
            echo "finns=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Testmiljön väntar på Scaleway-nyckeln. Lägg in SCW_ACCESS_KEY, SCW_SECRET_KEY, SCW_DEFAULT_PROJECT_ID och SCW_DEFAULT_ORGANIZATION_ID under Settings → Secrets and variables → Actions."
            {
              echo "### Testmiljön väntar på Scaleway-nyckeln"
              echo ""
              echo "Lägg in de fyra secrets som står i README under *Testmiljön*, och kör sedan jobbet igen under Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.nyckel.outputs.finns == 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.nyckel.outputs.finns == 'true'
        with:
          enable-cache: true

      - name: Vilken ändring är det?
        if: steps.nyckel.outputs.finns == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/commits/$TAG/pulls" --jq '.[0].number // empty' || true)
          TITLE=$(gh api "repos/${{ github.repository }}/commits/$TAG/pulls" --jq '.[0].title // empty' || true)
          if [ -z "$TITLE" ]; then TITLE=$(git log -1 --format=%s "$TAG"); fi
          echo "PR=$PR" >> "$GITHUB_ENV"
          {
            echo "TITLE<<TITEL_SLUT"
            echo "$TITLE"
            echo "TITEL_SLUT"
          } >> "$GITHUB_ENV"
          echo "BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
        if: steps.nyckel.outputs.finns == 'true'

      # ID:s bild med Mavens beroenden ur GitHubs cache, som i jobbet ID:s bild.
      - name: Bygg ID:s bild med Mavens beroenden ur cachen
        if: steps.nyckel.outputs.finns == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: id/Dockerfile
          tags: trainmeet-id:${{ env.TAG }}
          load: true
          build-args: |
            TRAINMEET_COMMIT=${{ env.TAG }}
            TRAINMEET_PR=${{ env.PR }}
            TRAINMEET_TITLE=${{ env.TITLE }}
            TRAINMEET_BUILT=${{ env.BUILT }}
          cache-from: type=gha,scope=id
          cache-to: type=gha,mode=max,scope=id

      - name: Bygg bilderna
        if: steps.nyckel.outputs.finns == 'true'
        run: |
          for part in hub catalog cad; do
            docker build -f "$part/Dockerfile" -t "trainmeet-$part:$TAG" \
              --build-arg TRAINMEET_COMMIT="$TAG" \
              --build-arg TRAINMEET_PR="$PR" \
              --build-arg TRAINMEET_TITLE="$TITLE" \
              --build-arg TRAINMEET_BUILT="$BUILT" .
          done
          docker build -f id/api.Dockerfile -t "trainmeet-idapi:$TAG" --build-arg TRAINMEET_COMMIT="$TAG" .
          docker build -f tkl/Dockerfile -t "trainmeet-tkl:$TAG" --build-arg TRAINMEET_COMMIT="$TAG" .

      - name: Servern hos Scaleway
        id: server
        if: steps.nyckel.outputs.finns == 'true'
        run: |
          uv sync --locked
          uv run python deploy/testmiljo.py ensure

      - name: Vänta tills servern är uppsatt
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
          SSH_USER: ${{ steps.server.outputs.user }}
          KEY: ${{ steps.server.outputs.key_file }}
          KNOWN: ${{ steps.server.outputs.known_hosts }}
          CATALOG_ENV: ${{ steps.server.outputs.catalog_env }}
          ID_ENV: ${{ steps.server.outputs.id_env }}
          CAD_ENV: ${{ steps.server.outputs.cad_env }}
          PICTURES_KEY: ${{ steps.server.outputs.pictures_key }}
        run: |
          echo "CATALOG_ENV=$CATALOG_ENV" >> "$GITHUB_ENV"
          echo "ID_ENV=$ID_ENV" >> "$GITHUB_ENV"
          echo "CAD_ENV=$CAD_ENV" >> "$GITHUB_ENV"
          SSH="ssh -i $KEY -o UserKnownHostsFile=$KNOWN -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o BatchMode=yes"
          echo "SSH=$SSH" >> "$GITHUB_ENV"
          echo "TARGET=$SSH_USER@$IP" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            $SSH "$SSH_USER@$IP" true 2>/dev/null && break
            sleep 5
          done
          $SSH "$SSH_USER@$IP" '
            set -e
            status=0
            cloud-init status --wait || status=$?
            # Exit 2 means cloud-init finished with recoverable errors.
            case "$status" in
              0|2) ;;
              *) exit "$status" ;;
            esac
            test -w /srv/trainmeet
            docker info >/dev/null
            docker compose version --short
          '

      - name: Lägg ut hubben, Catalog och ID
        if: steps.nyckel.outputs.finns == 'true'
        env:
          TEM_SECRET_KEY: ${{ secrets.TEM_SECRET_KEY }}
          BEDROCK_KEY_ID: ${{ secrets.BEDROCK_KEY_ID }}
          BEDROCK_SECRET_KEY: ${{ secrets.BEDROCK_SECRET_KEY }}
          ANTHROPIC_API_KEY_SEARCH: ${{ secrets.ANTHROPIC_API_KEY_SEARCH }}
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          STRIPE_TEST_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
          ID_OWNERS: ${{ secrets.ID_OWNERS }}
          CATALOG_FLYTT_PEPPER: ${{ secrets.CATALOG_FLYTT_PEPPER }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_TOPIC: ${{ secrets.APNS_TOPIC }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          IP: ${{ steps.server.outputs.ip }}
        run: |
          docker save "trainmeet-hub:$TAG" "trainmeet-catalog:$TAG" "trainmeet-id:$TAG" "trainmeet-idapi:$TAG" "trainmeet-tkl:$TAG" "trainmeet-cad:$TAG" | gzip | $SSH "$TARGET" 'gunzip | docker load'
          cat deploy/testmiljo/compose.yaml | $SSH "$TARGET" 'cat > /srv/trainmeet/compose.yaml'
          cat deploy/testmiljo/Caddyfile | $SSH "$TARGET" 'cat > /srv/trainmeet/Caddyfile'
          cat deploy/testmiljo/catalog-backup.sh | $SSH "$TARGET" 'cat > /srv/trainmeet/catalog-backup.sh'
          cat deploy/testmiljo/cad-backup.sh | $SSH "$TARGET" 'cat > /srv/trainmeet/cad-backup.sh'
          # Catalogs hemligheter går direkt från Secret Manager till servern och skrivs aldrig ut.
          $SSH "$TARGET" 'umask 077; cat > /srv/trainmeet/catalog.env' < "$CATALOG_ENV"
          $SSH "$TARGET" 'umask 077; cat > /srv/trainmeet/id.env' < "$ID_ENV"
          # CAD:s hemligheter (#89) likadant: databasen, säkerhetskopiorna och klienten cad i ID.
          $SSH "$TARGET" 'umask 077; cat > /srv/trainmeet/cad.env' < "$CAD_ENV"
          # Catalogs bilder (#51): nyckeln som bara når hinken går från Secret Manager till
          # catalog-vault på servern och skrivs aldrig ut. Utan den ligger bilderna på disken.
          if [ -n "$PICTURES_KEY" ] && [ -s "$PICTURES_KEY" ]; then
            $SSH "$TARGET" 'umask 077; mkdir -p /srv/trainmeet/catalog-vault && cat > /srv/trainmeet/catalog-vault/trainmeet_pictures-key' < "$PICTURES_KEY"
          fi
          # Mejlnyckeln (#66) går från GitHub direkt till ID:s valv på servern och skrivs aldrig ut.
          if [ -n "$TEM_SECRET_KEY" ]; then
            printf '%s' "$TEM_SECRET_KEY" | $SSH "$TARGET" 'umask 077; mkdir -p /srv/trainmeet/id-vault && cat > /srv/trainmeet/id-vault/trainmeet_smtp-password'
          fi
          # Nyckeln till Claude i Amazon Bedrock (#79, TOKEN-28) går samma väg och skrivs aldrig ut.
          # Utan den är mätaren avstängd.
          if [ -n "$BEDROCK_KEY_ID" ] && [ -n "$BEDROCK_SECRET_KEY" ]; then
            printf '%s\n%s\n' "$BEDROCK_KEY_ID" "$BEDROCK_SECRET_KEY" | $SSH "$TARGET" 'umask 077; mkdir -p /srv/trainmeet/id-vault && cat > /srv/trainmeet/id-vault/trainmeet_bedrock-key'
          fi
          # Nyckeln till Claudes webbsökning i Anthropics API (#53, TOKEN-30, C40) går samma väg
          # och skrivs aldrig ut. Utan den är webbsökningen inte inkopplad, och Catalog säger det.
          if [ -n "$ANTHROPIC_API_KEY_SEARCH" ]; then
            printf '%s\n' "$ANTHROPIC_API_KEY_SEARCH" | $SSH "$TARGET" 'umask 077; mkdir -p /srv/trainmeet/id-vault && cat > /srv/trainmeet/id-vault/trainmeet_search-key'
          fi
          # Stripes testnycklar för köpen (#79, TOKEN-02) går samma väg och skrivs aldrig ut.
          # Utan dem är köpen stängda.
          if [ -n "$STRIPE_TEST_SECRET_KEY" ] && [ -n "$STRIPE_TEST_WEBHOOK_SECRET" ]; then
            printf '%s\n%s\n' "$STRIPE_TEST_SECRET_KEY" "$STRIPE_TEST_WEBHOOK_SECRET" | $SSH "$TARGET" 'umask 077; mkdir -p /srv/trainmeet/id-vault && cat > /srv/trainmeet/id-vault/trainmeet_stripe-key'
          fi
          # Ägarnas adresser för ägarsidan (#79, TOKEN-05), en per rad, går samma väg.
          if [ -n "$ID_OWNERS" ]; then
            printf '%s\n' "$ID_OWNERS" | tr ', ' '\n\n' | $SSH "$TARGET" 'umask 077; mkdir -p /srv/trainmeet/id-vault && cat > /srv/trainmeet/id-vault/trainmeet_owners'
          fi
          # Apples push-nyckel (F20) går från GitHub direkt till testhubbens miljö på servern och
          # skrivs aldrig ut. Utan den går notiserna till låtsad push.
          {
            if [ -n "$APNS_KEY_ID" ] && [ -n "$APNS_TEAM_ID" ] && [ -n "$APNS_TOPIC" ] && [ -n "$APNS_KEY" ]; then
              echo "TRAINMEET_APNS_KEY_ID=$APNS_KEY_ID"
              echo "TRAINMEET_APNS_TEAM_ID=$APNS_TEAM_ID"
              echo "TRAINMEET_APNS_TOPIC=$APNS_TOPIC"
              printf 'TRAINMEET_APNS_KEY=%s\n' "$(printf '%s\n' "$APNS_KEY" | awk 'BEGIN { ORS = "\\n" } { print }')"
            fi
          } | $SSH "$TARGET" 'umask 077; cat > /srv/trainmeet/hub-push.env'
          # The move's pepper (#57) goes from GitHub straight to Catalog's own file on the server
          # and is never printed. Without it the old TrainCatalog's fleets wait unclaimed.
          {
            if [ -n "$CATALOG_FLYTT_PEPPER" ]; then
              printf 'CATALOG_FLYTT_PEPPER=%s\n' "$CATALOG_FLYTT_PEPPER"
            fi
          } | $SSH "$TARGET" 'umask 077; cat > /srv/trainmeet/catalog-flytt.env'
          # The tags' final address once trainmeet.app points here, else Catalog's own (C38).
          TAG_BASE="https://$CATALOG_DOMAIN/t/"
          if [ "$(getent ahostsv4 "$TAGS_DOMAIN" | awk 'NR==1{print $1}' || true)" = "$IP" ]; then
            TAG_BASE="https://$TAGS_DOMAIN/t/"
          fi
          $SSH "$TARGET" 'sh -s' -- "$TAG" "$DOMAIN" "$CATALOG_DOMAIN" "$ID_DOMAIN" "$TAGS_DOMAIN" "$TAG_BASE" "$PI_DOMAIN" "$TKL_DOMAIN" "$CAD_DOMAIN" < deploy/testmiljo/up.sh

      - name: Prova adressen
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
        run: |
          PEKAR=$(getent ahostsv4 "$DOMAIN" | awk 'NR==1{print $1}' || true)
          if [ "$PEKAR" != "$IP" ]; then
            echo "::warning::$DOMAIN pekar inte på servern än ($IP). Lägg in DNS-raden i Cloudflare."
            {
              echo "### Hubben är ute, men adressen saknas"
              echo ""
              echo "Lägg in en DNS-rad i Cloudflare: typ **A**, namn **${DOMAIN%%.trainmeet.app}**, innehåll **$IP**, proxy **av** (grått moln)."
              echo "Kör sedan jobbet igen, eller vänta till nästa ihopslagning."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 36); do
            # Caddy waits longer and longer between certificate attempts while DNS is missing.
            # Once DNS points here, one restart makes it try again at once.
            if [ "$i" = 7 ]; then $SSH "$TARGET" 'cd /srv/trainmeet && docker compose restart caddy'; fi
            if curl -fsS "https://$DOMAIN/api/version" | grep -q "\"commit\":\"$TAG\""; then
              {
                echo "### Testhubben är ute"
                echo ""
                echo "- https://$DOMAIN"
                echo "- Ändring: ${PR:+#$PR }$TITLE"
                echo "- Server: $IP"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$DOMAIN svarar inte med den nya versionen."
          exit 1

      - name: Prova Catalogs adress
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
        run: |
          PEKAR=$(getent ahostsv4 "$CATALOG_DOMAIN" | awk 'NR==1{print $1}' || true)
          if [ "$PEKAR" != "$IP" ]; then
            echo "::warning::$CATALOG_DOMAIN pekar inte på servern än. Lägg in DNS-raden i Cloudflare."
            {
              echo "### Catalog är ute, men adressen saknas"
              echo ""
              echo "Lägg in en DNS-rad i Cloudflare: typ **CNAME**, namn **${CATALOG_DOMAIN%%.trainmeet.app}**, mål **$DOMAIN**, proxy **av** (grått moln)."
              echo "Kör sedan jobbet igen, eller vänta till nästa ihopslagning."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 36); do
            if [ "$i" = 7 ]; then $SSH "$TARGET" 'cd /srv/trainmeet && docker compose restart caddy'; fi
            if curl -fsS "https://$CATALOG_DOMAIN/api/version" | grep -q "\"commit\":\"$TAG\""; then
              {
                echo "### Catalog är ute"
                echo ""
                echo "- https://$CATALOG_DOMAIN"
                echo "- Ändring: ${PR:+#$PR }$TITLE"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$CATALOG_DOMAIN svarar inte med den nya versionen."
          exit 1

      - name: Prova ID:s adress
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
        run: |
          PEKAR=$(getent ahostsv4 "$ID_DOMAIN" | awk 'NR==1{print $1}' || true)
          if [ "$PEKAR" != "$IP" ]; then
            echo "::warning::$ID_DOMAIN pekar inte på servern än. Lägg in DNS-raden i Cloudflare."
            {
              echo "### TrainMeet ID är ute, men adressen saknas"
              echo ""
              echo "Lägg in en DNS-rad i Cloudflare: typ **CNAME**, namn **${ID_DOMAIN%%.trainmeet.app}**, mål **$DOMAIN**, proxy **av** (grått moln)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 36); do
            if [ "$i" = 7 ]; then $SSH "$TARGET" 'cd /srv/trainmeet && docker compose restart caddy'; fi
            if curl -fsS "https://$ID_DOMAIN/realms/trainmeet/.well-known/openid-configuration" | grep -q "\"issuer\":\"https://$ID_DOMAIN/realms/trainmeet\"" &&
              curl -fsS "https://$ID_DOMAIN/api/version" | grep -q "\"commit\":\"$TAG\""; then
              {
                echo "### TrainMeet ID är ute"
                echo ""
                echo "- https://$ID_DOMAIN"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$ID_DOMAIN svarar inte."
          exit 1

      - name: Prova Låtsas-Pi:ns adress
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
        run: |
          PEKAR=$(getent ahostsv4 "$PI_DOMAIN" | awk 'NR==1{print $1}' || true)
          if [ "$PEKAR" != "$IP" ]; then
            echo "::warning::$PI_DOMAIN pekar inte på servern än. Lägg in DNS-raden i Cloudflare."
            {
              echo "### Låtsas-Pi är ute, men adressen saknas"
              echo ""
              echo "Lägg in en DNS-rad i Cloudflare: typ **CNAME**, namn **${PI_DOMAIN%%.trainmeet.app}**, mål **$DOMAIN**, proxy **av** (grått moln)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 36); do
            if [ "$i" = 7 ]; then $SSH "$TARGET" 'cd /srv/trainmeet && docker compose restart caddy'; fi
            if curl -fsS "https://$PI_DOMAIN/api/version" | grep -q "\"commit\":\"$TAG\""; then
              {
                echo "### Låtsas-Pi är ute"
                echo ""
                echo "- https://$PI_DOMAIN"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$PI_DOMAIN svarar inte."
          exit 1

      - name: Prova TKL:s adress
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
        run: |
          PEKAR=$(getent ahostsv4 "$TKL_DOMAIN" | awk 'NR==1{print $1}' || true)
          if [ "$PEKAR" != "$IP" ]; then
            echo "::warning::$TKL_DOMAIN pekar inte på servern än. Lägg in DNS-raden i Cloudflare."
            {
              echo "### TKL är ute, men adressen saknas"
              echo ""
              echo "Lägg in en DNS-rad i Cloudflare: typ **CNAME**, namn **${TKL_DOMAIN%%.trainmeet.app}**, mål **$DOMAIN**, proxy **av** (grått moln)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 36); do
            if [ "$i" = 7 ]; then $SSH "$TARGET" 'cd /srv/trainmeet && docker compose restart caddy'; fi
            if curl -fsS "https://$TKL_DOMAIN/api/version" | grep -q "\"commit\":\"$TAG\""; then
              {
                echo "### TKL är ute"
                echo ""
                echo "- https://$TKL_DOMAIN"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$TKL_DOMAIN svarar inte."
          exit 1

      - name: Prova CAD:s adress
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
        run: |
          PEKAR=$(getent ahostsv4 "$CAD_DOMAIN" | awk 'NR==1{print $1}' || true)
          if [ "$PEKAR" != "$IP" ]; then
            echo "::warning::$CAD_DOMAIN pekar inte på servern än. Lägg in DNS-raden i Cloudflare."
            {
              echo "### CAD är ute, men adressen saknas"
              echo ""
              echo "Lägg in en DNS-rad i Cloudflare: typ **CNAME**, namn **${CAD_DOMAIN%%.trainmeet.app}**, mål **$DOMAIN**, proxy **av** (grått moln)."
              echo "Kör sedan jobbet igen, eller vänta till nästa ihopslagning."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 36); do
            if [ "$i" = 7 ]; then $SSH "$TARGET" 'cd /srv/trainmeet && docker compose restart caddy'; fi
            if curl -fsS "https://$CAD_DOMAIN/api/version" | grep -q "\"commit\":\"$TAG\""; then
              {
                echo "### CAD är ute"
                echo ""
                echo "- https://$CAD_DOMAIN"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$CAD_DOMAIN svarar inte."
          exit 1

      - name: Prova taggarnas adress
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
        run: |
          PEKAR=$(getent ahostsv4 "$TAGS_DOMAIN" | awk 'NR==1{print $1}' || true)
          if [ "$PEKAR" != "$IP" ]; then
            echo "::warning::$TAGS_DOMAIN pekar inte på servern än. Lägg in DNS-raden i Cloudflare."
            {
              echo "### Taggarnas adress saknas"
              echo ""
              echo "Lägg in en DNS-rad i Cloudflare för zonen **$TAGS_DOMAIN**: typ **CNAME**, namn **@**, mål **$DOMAIN**, proxy **av** (grått moln)."
              echo "Till dess har taggarna Catalogs adress i testmiljön."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # /t/<uid> goes on to Catalog in the test environment until production exists (C38).
          for i in $(seq 1 36); do
            if [ "$i" = 7 ]; then $SSH "$TARGET" 'cd /srv/trainmeet && docker compose restart caddy'; fi
            WHERE=$(curl -fsS -o /dev/null -w '%{redirect_url}' "https://$TAGS_DOMAIN/t/prov" || true)
            if [ "$WHERE" = "https://$CATALOG_DOMAIN/t/prov" ]; then
              {
                echo "### Taggarnas adress svarar"
                echo ""
                echo "- https://$TAGS_DOMAIN/t/ går vidare till https://$CATALOG_DOMAIN/t/"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$TAGS_DOMAIN/t/ går inte vidare till Catalog."
          exit 1

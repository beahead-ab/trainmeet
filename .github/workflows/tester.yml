# Körs på varje PR och varje ändring på main: kodstil, typer, testerna och bilderna för
# Hubben, Catalog och TrainMeet ID. Alla fyra kontrollerna, "Tester", "Hubbens bild",
# "Catalogs bild" och "ID:s bild", ska vara gröna innan en PR slås ihop.
name: Tester

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tester-${{ github.ref }}
  # A newer push replaces an older test run on a PR, but a run on main is never cut off:
  # it may be in the middle of putting the hub out in the test environment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tester:
    name: Tester
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # TrainMeet Catalog's tests need a PostgreSQL of their own (catalog/tests/conftest.py).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: prov
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      CATALOG_TEST_DATABASE_URL: postgresql://postgres:prov@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installera
        run: uv sync --locked

      - name: Kodstil
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Typer
        run: uv run mypy

      # The physical TMBoxes are tried against a real Mosquitto (#74, DRIFT-22).
      - name: Mosquitto
        run: |
          sudo apt-get install -y -q mosquitto \
            || (sudo apt-get update -q && sudo apt-get install -y -q mosquitto)

      - name: Testerna
        run: uv run pytest

      - name: Kontraktens TypeScript-typer
        run: |
          npx --yes openapi-typescript@7.10.1 contracts/openapi.json -o contracts/types.d.ts --check
          npx --yes openapi-typescript@7.10.1 contracts/catalog.openapi.json -o contracts/catalog.d.ts --check
          npx --yes openapi-typescript@7.10.1 contracts/id.openapi.json -o contracts/id.d.ts --check

  bilden:
    name: Hubbens bild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Bygg bilden
        run: >
          docker build -f hub/Dockerfile -t trainmeet-hub:prov
          --build-arg TRAINMEET_COMMIT=${{ github.sha }} .

      - name: Starta bilden och prova sidorna
        run: |
          docker run -d --name hub -p 8080:8080 trainmeet-hub:prov
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q "<title>TrainMeet Hub</title>"
          curl -fsSI http://localhost:8080/drift/klienter | grep -qi "content-security-policy: default-src 'self'"
          SCRIPT=$(curl -fsS http://localhost:8080/drift | grep -o '/drift/assets/[^"]*\.js' | head -1)
          curl -fsS "http://localhost:8080$SCRIPT" | grep -q "Öppna Provbanan"
          curl -fsS "http://localhost:8080$SCRIPT" | grep -q "Ingen träff är startad"
          curl -fsS http://localhost:8080/api/version | grep -q '"hub_name":"Hubben"'
          curl -fsS http://localhost:8080/provbanan | grep -q "<title>TrainMeet Hub</title>"
          curl -fsS http://localhost:8080/planering | grep -q "<title>Planering · TrainMeet Hub</title>"
          PLAN=$(curl -fsS http://localhost:8080/planering | grep -o '/planering/assets/[^"]*\.js' | head -1)
          curl -fsS "http://localhost:8080$PLAN" | grep -q "Skapa träffen"
          curl -fsS "http://localhost:8080$SCRIPT" | grep -q "Starta provkörning"
          curl -fsS -H 'Content-Type: application/json' -d '{"version":1}' \
            http://localhost:8080/api/provbanan/start | grep -q '"meet_id":"provbanan"'
          curl -fsS http://localhost:8080/api/version | grep -q '"product":"TrainMeet Hub"'
          curl -fsS http://localhost:8080/planering/provbanan/graf | grep -q "<title>Planering · TrainMeet Hub</title>"
          curl -fsS "http://localhost:8080$PLAN" | grep -q "Lägg till underlag"
          curl -fsS "http://localhost:8080$PLAN" | grep -q "dra i sidled för resten av dygnet"
          docker inspect --format '{{.Config.User}}' hub | grep -qx hub
          # Sidorna i React (H62): appen och dess egna filer, på sin adress och på en av sina sidor.
          curl -fsS http://localhost:8080/skarm | grep -q "TrainMeet · Skärm"
          curl -fsSI http://localhost:8080/skarm/ansluten | grep -qi "content-security-policy: default-src 'self'"
          SCRIPT=$(curl -fsS http://localhost:8080/skarm | grep -o '/skarm/assets/[^"]*\.js' | head -1)
          curl -fsS "http://localhost:8080$SCRIPT" | grep -q "Anslut skärmen"
          curl -fsS http://localhost:8080/box | grep -q "TrainMeet Hub · TMBox"
          curl -fsS http://localhost:8080/provbanan/box | grep -q "TrainMeet Hub · TMBox"
          SCRIPT=$(curl -fsS http://localhost:8080/box | grep -o '/box/assets/[^"]*\.js' | head -1)
          curl -fsS "http://localhost:8080$SCRIPT" | grep -q "Koppla från"

      - name: Belastningsprovet, 40 boxar och 30 stationsklienter (DRIFT-20)
        run: |
          # Hubbens träff med Provbanan: varje box hämtar sin bild varje sekund och varje
          # stationsklient sin ögonblicksbild varannan sekund. Rött om Drift ger ett enda fel
          # eller om p99 är över en sekund.
          curl -fsS -H 'Content-Type: application/json' -d '{"name":"Hubben","pin":"482915"}' \
            http://localhost:8080/api/hub/setup >/dev/null
          python3 deploy/belastning.py --hub http://localhost:8080 --pin 482915 --start \
            --boxes 40 --clients 30 --seconds 20 --strict

      - name: Två hubbar ur bilden, Pi:n följer molnet (Synk, ärende 73)
        run: |
          # Molnet och en Pi på ett eget nät: Pi:n ringer ut till http://moln:8080, som på testmiljöns
          # Låtsas-Pi. Pi:n kopplas med en kod, följer versionen, startar träffen och leder den;
          # molnet följer Pi:ns körning live.
          docker network create synk
          docker run -d --name moln --network synk -p 8090:8080 trainmeet-hub:prov
          docker run -d --name pi --network synk -p 8091:8080 trainmeet-hub:prov
          for port in 8090 8091; do
            for i in $(seq 1 30); do
              curl -fsS "http://localhost:$port/healthz" >/dev/null 2>&1 && break
              sleep 1
            done
          done
          JSON='Content-Type: application/json'
          curl -fsS -c moln.txt -H "$JSON" -d '{"name":"Molnet","pin":"482915"}' http://localhost:8090/api/hub/setup >/dev/null
          curl -fsS -c pi.txt -H "$JSON" -d '{"name":"Pi:n","pin":"482915"}' http://localhost:8091/api/hub/setup >/dev/null
          MOLN=http://localhost:8090/api/planering/1/meets
          curl -fsS -b moln.txt -H "$JSON" -d '{"name":"Värnamo","first_date":"2026-10-30","last_date":"2026-11-01"}' "$MOLN" >/dev/null
          SRC=$(curl -fsS -b moln.txt -H 'Content-Type: application/octet-stream' \
            --data-binary @integrationer/tests/fixtures/varnamo.json.gz "$MOLN/varnamo/sources?name=varnamo.json.gz" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["source"]["id"])')
          curl -fsS -b moln.txt -H "$JSON" -d '{}' "$MOLN/varnamo/sources/$SRC/apply" >/dev/null
          curl -fsS -b moln.txt -H "$JSON" -d '{}' "$MOLN/varnamo/versions" >/dev/null
          CODE=$(curl -fsS -b moln.txt -H "$JSON" -d '{}' http://localhost:8090/api/sync/1/meets/varnamo/code |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["code"])')
          curl -fsS -b pi.txt -H "$JSON" -d "{\"address\":\"http://moln:8080\",\"code\":\"$CODE\"}" \
            http://localhost:8091/api/hub/cloud | grep -q '"versions":1'
          curl -fsS -b pi.txt -H "$JSON" -d '{"meet":"varnamo","version":1}' http://localhost:8091/api/drift/1/start >/dev/null
          sleep 3
          curl -fsS -b moln.txt -H "$JSON" -d '{"meet":"varnamo","version":1}' http://localhost:8090/api/drift/1/start >/dev/null
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8090/api/drift/1/now | grep -q '"hub_name":"Pi:n"' && break
            sleep 1
          done
          curl -fsS http://localhost:8090/api/drift/1/now | grep -q '"hub_name":"Pi:n"'
          echo "Pi:n leder träffen och molnet följer den."
          # Reläet (SYNK-11): en telefon utanför träffens nät ansluter till Pi:n genom molnet.
          # Pi:n säger adressen när en klient ansluter på träffens nät.
          KOD=$(curl -fsS -b pi.txt http://localhost:8091/api/drift/1/connect |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["code"])')
          TEL="{\"kind\":\"tmbox_app\",\"name\":\"Telefonen\",\"software\":\"TMBox\",\"code\":\"$KOD\"}"
          RELA=$(curl -fsS -H "$JSON" -d "$TEL" http://localhost:8091/api/station/1/connect |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["relay"].split(":8080", 1)[1])')
          for i in $(seq 1 20); do
            curl -fsS -H "$JSON" -d "$TEL" "http://localhost:8090$RELA/api/station/1/connect" |
              grep -q '"status":"waiting"' && break
            sleep 1
          done
          curl -fsS -H "$JSON" -d "$TEL" "http://localhost:8090$RELA/api/station/1/connect" |
            grep -q '"status":"waiting"'
          echo "En telefon når Pi:n genom molnets relä."
          # Push (F20): bilden har det som behövs för Apples tjänst, HTTP/2 och den signerade nyckeln.
          docker exec moln /app/.venv/bin/python -c 'import h2, httpx, jwt; from synk.push import ApnsPush'
          echo "Bilden kan skicka push."

      - name: Visa loggen om något gick fel
        if: failure()
        run: |
          docker logs hub || true
          docker logs moln || true
          docker logs pi || true

  # TrainMeet Catalog: webbappens typer och tester körs när bilden byggs. Sedan provas bilden
  # med testmiljöns egen compose-fil: databasen, säkerhetskopian före migreringen, migreringen,
  # Catalog i läget check, provinloggningen och en säkerhetskopia med data i (CAT-39).
  catalog:
    name: Catalogs bild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROV: /tmp/catalog-testmiljo
    steps:
      - uses: actions/checkout@v4

      - name: Bygg bilden
        run: >
          docker build -f catalog/Dockerfile -t trainmeet-catalog:prov
          --build-arg TRAINMEET_COMMIT=${{ github.sha }} .

      - name: Starta databasen som i testmiljön
        run: |
          mkdir -p "$PROV"
          cp deploy/testmiljo/compose.yaml deploy/testmiljo/catalog-backup.sh "$PROV/"
          cd "$PROV"
          umask 077
          {
            echo "HUB_TAG=prov"
            echo "HUB_DOMAIN=localhost"
            echo "PI_DOMAIN=localhost"
            echo "CATALOG_TAG=prov"
            echo "CATALOG_DOMAIN=localhost"
            echo "CATALOG_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "CATALOG_BACKUP_KEY=$(openssl rand -hex 32)"
            echo "CATALOG_TRIAL_LOGIN=on"
            echo "CATALOG_TAG_BASE=https://localhost/t/"
            echo "TAGS_DOMAIN=localhost"
            # Compose-filen har ID också; provet här startar det inte, men namnen ska finnas.
            echo "ID_TAG=prov"
            echo "ID_DOMAIN=localhost"
            echo "ID_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "ID_ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "ID_CATALOG_SECRET=$(openssl rand -hex 32)"
            echo "ID_APP_SECRET=$(openssl rand -hex 32)"
            echo "HOST_UID=$(id -u)"
          } > .env
          docker compose up -d --wait catalog-db

      - name: Säkerhetskopian före migreringen, migreringen och Catalog
        run: |
          cd "$PROV"
          # Catalog vägrar starta mot en databas som inte är migrerad.
          if UT=$(timeout 60 docker compose run --rm --no-deps catalog 2>&1); then
            echo "::error::Catalog startade mot en omigrerad databas."; exit 1
          fi
          echo "$UT" | grep -q "saknar migrationer"
          TESTMILJO_DIR="$PROV" sh catalog-backup.sh fore-migrering
          docker compose run --rm --no-deps catalog python -m catalog.migrate
          docker compose run --rm --no-deps catalog python -m catalog.migrate --check
          docker compose up -d --no-deps catalog

      - name: Prova Catalog
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8081/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8081/healthz | grep -qx ok
          curl -fsS http://localhost:8081/api/version | grep -q '"product":"TrainMeet Catalog"'
          curl -fsS http://localhost:8081/api/version | grep -q '"commit":"${{ github.sha }}"'
          curl -fsS http://localhost:8081/ | grep -q "<title>TrainMeet Catalog</title>"
          curl -fsS http://localhost:8081/fordon | grep -q 'id="root"'
          curl -fsS -o /dev/null http://localhost:8081/manifest.webmanifest
          curl -fsS -I http://localhost:8081/fordon | grep -qi "content-security-policy: default-src 'self'"
          curl -fsS http://localhost:8081/api/catalog/1/session | grep -q '"login":"trial"'
          ACCOUNT=$(curl -fsS http://localhost:8081/api/catalog/1/trial/accounts | jq -r '.[0].id')
          curl -fsS -c "$PROV/kakor" -H 'Content-Type: application/json' -d "{\"account\":\"$ACCOUNT\"}" \
            http://localhost:8081/api/catalog/1/trial/login | grep -q '"name":"Provkonto A"'
          curl -fsS -b "$PROV/kakor" http://localhost:8081/api/catalog/1/session | grep -q '"name":"Provkonto A"'
          # En simulerad tagg, som i testmiljön: okänd tills den kopplas (#54).
          TAGG=$(curl -fsS -b "$PROV/kakor" -X POST http://localhost:8081/api/catalog/1/tags/simulated | jq -r .uid)
          curl -fsS -b "$PROV/kakor" "http://localhost:8081/api/catalog/1/tags/$TAGG" | grep -q '"outcome":"unknown"'
          curl -fsS "http://localhost:8081/t/$TAGG" | grep -q 'id="root"'
          docker inspect --format '{{.Config.User}}' "$(docker compose -f "$PROV/compose.yaml" ps -q catalog)" | grep -qx catalog

      - name: Nattens säkerhetskopia, med data i
        run: |
          cd "$PROV"
          TESTMILJO_DIR="$PROV" sh catalog-backup.sh natt
          ls catalog-backup/*-natt.dump.enc catalog-backup/*-fore-migrering.dump.enc
          # Krypterad: pg_dumps eget huvud (PGDMP) syns inte i filen.
          if head -c 5 catalog-backup/*-natt.dump.enc | grep -q PGDMP; then exit 1; fi

      - name: Visa loggen om något gick fel
        if: failure()
        run: cd "$PROV" && docker compose logs || true

  # Lägger ut hubben på test.hub.trainmeet.app när en ändring har slagits ihop med main
  # och båda kontrollerna är gröna. Servern skapas första gången (deploy/testmiljo.py).
  # TrainMeet ID: tilläggets tester körs när bilden byggs. Sedan provas inloggningen med en kod
  # till e-posten mot en riktig Keycloak och PostgreSQL, med en låtsad mejlserver, och genom
  # Catalog in med samma konto (#66).
  id:
    name: ID:s bild
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Bygg bilderna
        run: |
          docker build -f id/Dockerfile -t trainmeet-id:prov --build-arg TRAINMEET_COMMIT=${{ github.sha }} .
          docker build -f id/api.Dockerfile -t trainmeet-idapi:prov --build-arg TRAINMEET_COMMIT=${{ github.sha }} .

      - name: Starta ID med databas och en låtsad mejlserver
        run: |
          uv sync --locked
          # Mejlservern kräver inloggning, som Scaleways, med ett lösenord som ID läser ur valvet.
          mkdir -p "$RUNNER_TEMP/valv"
          LOSEN=$(openssl rand -hex 16)
          printf '%s' "$LOSEN" > "$RUNNER_TEMP/valv/trainmeet_smtp-password"
          POSTLADA_ANVANDARE=prov-projekt POSTLADA_LOSENORD="$LOSEN" \
            nohup uvx --from aiosmtpd python id/postlada.py "$RUNNER_TEMP/mejl.txt" 2525 > "$RUNNER_TEMP/postlada.log" 2>&1 &
          docker run -d --name id-db --network host -e POSTGRES_DB=keycloak -e POSTGRES_USER=keycloak \
            -e POSTGRES_PASSWORD=prov postgres:17-alpine
          for i in $(seq 1 30); do docker exec id-db pg_isready -U keycloak >/dev/null 2>&1 && break; sleep 1; done
          docker run -d --name id --network host -v "$RUNNER_TEMP/valv:/opt/keycloak/vault:ro" \
            -e KC_DB_URL=jdbc:postgresql://127.0.0.1:5432/keycloak -e KC_DB_USERNAME=keycloak -e KC_DB_PASSWORD=prov \
            -e KC_HOSTNAME=http://127.0.0.1:8080 -e KC_BOOTSTRAP_ADMIN_USERNAME=tm-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -hex 16)" \
            -e ID_SMTP_HOST=127.0.0.1 -e ID_SMTP_PORT=2525 -e ID_SMTP_SSL=false -e ID_SMTP_STARTTLS=false \
            -e ID_SMTP_AUTH=true -e ID_SMTP_USER=prov-projekt -e ID_SMTP_FROM=konto@trainmeet.se \
            -e ID_CATALOG_SECRET=prov-hemlighet -e ID_CATALOG_URL=http://localhost:8001 \
            -e ID_APP_SECRET=id-hemlighet -e ID_PUBLIC_URL=http://localhost:8002 \
            trainmeet-id:prov
          for i in $(seq 1 120); do curl -fsS http://127.0.0.1:9000/health/ready >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:9000/health/ready
          docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' id | grep -qx "${{ github.sha }}"

      # ID:s API och webbapp (#67) ur sin egen bild, med en egen databas och samma mejlserver.
      - name: Starta ID:s API
        run: |
          docker exec id-db createdb -U keycloak idapi
          docker run -d --name id-api --network host -v "$RUNNER_TEMP/valv:/vault:ro" \
            -e ID_API_DATABASE_URL=postgresql://keycloak:prov@127.0.0.1:5432/idapi \
            -e ID_API_ISSUER=http://127.0.0.1:8080/realms/trainmeet -e ID_API_SECRET=id-hemlighet \
            -e ID_API_PUBLIC_URL=http://localhost:8002 \
            -e ID_SMTP_HOST=127.0.0.1 -e ID_SMTP_PORT=2525 -e ID_SMTP_SSL=false -e ID_SMTP_STARTTLS=false \
            -e ID_SMTP_AUTH=true -e ID_SMTP_USER=prov-projekt -e ID_SMTP_PASSWORD_FILE=/vault/trainmeet_smtp-password \
            -e ID_SUPPORT_ADDRESS=support@example.com \
            -e ID_API_CATALOG=http://127.0.0.1:8001 \
            --user "$(id -u):0" \
            trainmeet-idapi:prov uvicorn id.app:app --host 127.0.0.1 --port 8002 --no-access-log
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8002/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8002/api/version | grep -q "\"commit\":\"${{ github.sha }}\""

      - name: Starta Catalog mot ID
        run: |
          docker exec id-db createdb -U keycloak catalog
          CATALOG_DATABASE_URL=postgresql://keycloak:prov@127.0.0.1:5432/catalog CATALOG_MIGRATE=auto \
          CATALOG_ID_ISSUER=http://127.0.0.1:8080/realms/trainmeet CATALOG_ID_SECRET=prov-hemlighet \
          CATALOG_PUBLIC_URL=http://localhost:8001 CATALOG_ID_API=http://127.0.0.1:8002 \
          CATALOG_ID_WEB=http://localhost:8002 \
            nohup uv run uvicorn catalog.app:app --port 8001 --no-access-log > "$RUNNER_TEMP/catalog.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8001/healthz >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:8001/healthz

      # Från ID:s sida som Catalog, och sedan genom Catalog som en webbläsare (KONTO-27).
      - name: Logga in med en kod till e-posten, också i Catalog
        run: >
          uv run python -m id.prov_inloggning http://127.0.0.1:8080 "$RUNNER_TEMP/mejl.txt"
          prov-hemlighet http://localhost:8001 --catalog --id-app=http://localhost:8002

      - name: Visa loggen om något gick fel
        if: failure()
        run: |
          docker logs id 2>&1 | tail -100 || true
          docker logs id-api 2>&1 | tail -50 || true
          cat "$RUNNER_TEMP/postlada.log" || true
          cat "$RUNNER_TEMP/catalog.log" || true

      # Mejlservern och Catalog körs genom uv och håller uv:s cache låst. De stängs av före
      # jobbets egen städning, som annars väntar på låset tills den ger upp.
      - name: Stäng av provets program
        if: always()
        run: |
          pkill -f "id/postlada.py" || true
          pkill -f "uvicorn catalog.app" || true
          for i in $(seq 1 10); do pgrep -f "id/postlada.py|uvicorn catalog.app" >/dev/null || break; sleep 1; done

  # Pi-paketet (steg 5, DRIFT-20): hubben för en Raspberry Pi, som tjänster i systemd utan
  # containrar. Samma sidor och samma låsta beroenden som bilden. Paketet installeras och startas
  # här som Pi:n gör det, och på main läggs det i den rullande utgåvan pi-senaste, som Pi:ns
  # installation och uppdatering hämtar (deploy/pi/install.sh).
  pi:
    name: Pi-paketet
    needs: [tester, bilden]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Bygg paketet
        run: |
          mkdir -p package/wheel package/web package/pi
          # The web apps from the image's own first stage: built, typed and tested there.
          docker build -f hub/Dockerfile --target web -t trainmeet-web:pi .
          docker create --name web trainmeet-web:pi >/dev/null
          for app in skarmar tmbox-webb trafikledning planering; do
            docker cp "web:/src/apps/$app/dist" "package/web/$app"
          done
          docker rm web >/dev/null
          uv build --wheel -o package/wheel
          # The hub's locked dependencies, with their hashes: the Pi installs exactly these.
          uv export --frozen --no-emit-project --no-default-groups --group push \
            --no-header --format requirements-txt -o package/requirements.txt
          cp deploy/pi/* package/pi/
          git rev-parse --short=12 HEAD > package/BUILD
          {
            echo "TRAINMEET_COMMIT=$(git rev-parse --short=12 HEAD)"
            echo "TRAINMEET_BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > package/build.env
          tar -czf trainmeet-hub-pi.tar.gz package
          sha256sum trainmeet-hub-pi.tar.gz > trainmeet-hub-pi.tar.gz.sha256
          cp package/BUILD BUILD
          ls -l trainmeet-hub-pi.tar.gz

      - name: Installera och starta paketet som Pi:n gör
        run: |
          sudo apt-get install -y -q mosquitto \
            || (sudo apt-get update -q && sudo apt-get install -y -q mosquitto)
          python3 -m venv /tmp/pi
          /tmp/pi/bin/pip install --quiet --disable-pip-version-check --require-hashes -r package/requirements.txt
          /tmp/pi/bin/pip install --quiet --disable-pip-version-check --no-deps package/wheel/*.whl
          mkdir -p /tmp/pi-data
          set -a; . package/build.env; set +a
          TRAINMEET_PREVIEW_DB=/tmp/pi-data/p.sqlite3 HUB_WEB_DIR="$PWD/package/web" \
            TRAINMEET_MQTT_HOST=127.0.0.1 TRAINMEET_TMBOX_ANNOUNCE=0 \
            /tmp/pi/bin/uvicorn hub.app:app --port 8099 > /tmp/pi.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8099/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8099/ | grep -q "<title>TrainMeet Hub</title>"
          curl -fsS http://localhost:8099/planering | grep -q "Planering · TrainMeet Hub"
          curl -fsS http://localhost:8099/api/version | grep -q "\"commit\":\"$(cat package/BUILD)\""
          curl -sS http://localhost:8099/api/hub/wifi -o /dev/null -w '%{http_code}' | grep -q 401
          # A TMBox over MQTT, as on the Pi: Mosquitto beside the hub (#74, DRIFT-22).
          curl -fsS -c /tmp/pi-jar -H 'Content-Type: application/json' \
            -d '{"name":"Pi:n","pin":"482915"}' http://localhost:8099/api/hub/setup >/dev/null
          curl -fsS -b /tmp/pi-jar -H 'Content-Type: application/json' -d '{"version":1}' \
            http://localhost:8099/api/drift/1/start >/dev/null
          /tmp/pi/bin/python deploy/tmbox_prov.py --box prov-1 --seconds 1 --strict
          curl -fsS -b /tmp/pi-jar http://localhost:8099/api/drift/1/clients | grep -q '"kind":"tmbox"'
          /tmp/pi/bin/python -c "import synk.network_host, synk.push, hub.pin"
          sh -n package/pi/install.sh
          echo "Pi-paketet installeras, startar och visar sidorna."

      - name: Visa loggen om något gick fel
        if: failure()
        run: cat /tmp/pi.log || true

      - name: Lägg ut paketet i pi-senaste
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view pi-senaste >/dev/null 2>&1 || gh release create pi-senaste \
            --prerelease --target main --title "Pi-paketet, senaste" \
            --notes "TrainMeet Hub för en Raspberry Pi, byggd från main. Hämta install.sh och kör sudo sh install.sh. Hubben uppdaterar sig sedan från den här utgåvan, på knapptryck under kugghjulet."
          gh release upload pi-senaste trainmeet-hub-pi.tar.gz trainmeet-hub-pi.tar.gz.sha256 \
            BUILD deploy/pi/install.sh --clobber

  testmiljon:
    name: Testmiljön
    needs: [tester, bilden, catalog, id]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: testmiljon
      cancel-in-progress: false
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      TESTMILJO_TYPE: ${{ vars.TESTMILJO_TYPE }}
      DOMAIN: ${{ vars.TESTHUB_DOMAIN || 'test.hub.trainmeet.app' }}
      CATALOG_DOMAIN: ${{ vars.TESTCATALOG_DOMAIN || 'test.catalog.trainmeet.app' }}
      ID_DOMAIN: ${{ vars.TESTID_DOMAIN || 'test.id.trainmeet.app' }}
      PI_DOMAIN: ${{ vars.TESTPI_DOMAIN || 'test.pi.trainmeet.app' }}
      TAGS_DOMAIN: ${{ vars.TESTTAGS_DOMAIN || 'trainmeet.app' }}
      TAG: ${{ github.sha }}
    steps:
      - name: Finns Scaleway-nyckeln?
        id: nyckel
        run: |
          if [ -n "$SCW_SECRET_KEY" ] && [ -n "$SCW_ACCESS_KEY" ] && [ -n "$SCW_DEFAULT_PROJECT_ID" ] && [ -n "$SCW_DEFAULT_ORGANIZATION_ID" ]; then
            echo "finns=true" >> "$GITHUB_OUTPUT"
          else
            echo "finns=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Testmiljön väntar på Scaleway-nyckeln. Lägg in SCW_ACCESS_KEY, SCW_SECRET_KEY, SCW_DEFAULT_PROJECT_ID och SCW_DEFAULT_ORGANIZATION_ID under Settings → Secrets and variables → Actions."
            {
              echo "### Testmiljön väntar på Scaleway-nyckeln"
              echo ""
              echo "Lägg in de fyra secrets som står i README under *Testmiljön*, och kör sedan jobbet igen under Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.nyckel.outputs.finns == 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.nyckel.outputs.finns == 'true'
        with:
          enable-cache: true

      - name: Vilken ändring är det?
        if: steps.nyckel.outputs.finns == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/commits/$TAG/pulls" --jq '.[0].number // empty' || true)
          TITLE=$(gh api "repos/${{ github.repository }}/commits/$TAG/pulls" --jq '.[0].title // empty' || true)
          if [ -z "$TITLE" ]; then TITLE=$(git log -1 --format=%s "$TAG"); fi
          echo "PR=$PR" >> "$GITHUB_ENV"
          {
            echo "TITLE<<TITEL_SLUT"
            echo "$TITLE"
            echo "TITEL_SLUT"
          } >> "$GITHUB_ENV"
          echo "BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Bygg bilderna
        if: steps.nyckel.outputs.finns == 'true'
        run: |
          for part in hub catalog id; do
            docker build -f "$part/Dockerfile" -t "trainmeet-$part:$TAG" \
              --build-arg TRAINMEET_COMMIT="$TAG" \
              --build-arg TRAINMEET_PR="$PR" \
              --build-arg TRAINMEET_TITLE="$TITLE" \
              --build-arg TRAINMEET_BUILT="$BUILT" .
          done
          docker build -f id/api.Dockerfile -t "trainmeet-idapi:$TAG" --build-arg TRAINMEET_COMMIT="$TAG" .

      - name: Servern hos Scaleway
        id: server
        if: steps.nyckel.outputs.finns == 'true'
        run: |
          uv sync --locked
          uv run python deploy/testmiljo.py ensure

      - name: Vänta tills servern är uppsatt
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
          SSH_USER: ${{ steps.server.outputs.user }}
          KEY: ${{ steps.server.outputs.key_file }}
          KNOWN: ${{ steps.server.outputs.known_hosts }}
          CATALOG_ENV: ${{ steps.server.outputs.catalog_env }}
          ID_ENV: ${{ steps.server.outputs.id_env }}
        run: |
          echo "CATALOG_ENV=$CATALOG_ENV" >> "$GITHUB_ENV"
          echo "ID_ENV=$ID_ENV" >> "$GITHUB_ENV"
          SSH="ssh -i $KEY -o UserKnownHostsFile=$KNOWN -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o BatchMode=yes"
          echo "SSH=$SSH" >> "$GITHUB_ENV"
          echo "TARGET=$SSH_USER@$IP" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            $SSH "$SSH_USER@$IP" true 2>/dev/null && break
            sleep 5
          done
          $SSH "$SSH_USER@$IP" '
            set -e
            status=0
            cloud-init status --wait || status=$?
            # Exit 2 means cloud-init finished with recoverable errors.
            case "$status" in
              0|2) ;;
              *) exit "$status" ;;
            esac
            test -w /srv/trainmeet
            docker info >/dev/null
            docker compose version --short
          '

      - name: Lägg ut hubben, Catalog och ID
        if: steps.nyckel.outputs.finns == 'true'
        env:
          TEM_SECRET_KEY: ${{ secrets.TEM_SECRET_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_TOPIC: ${{ secrets.APNS_TOPIC }}
          APNS_KEY: ${{ secrets.APNS_KEY }}
          IP: ${{ steps.server.outputs.ip }}
        run: |
          docker save "trainmeet-hub:$TAG" "trainmeet-catalog:$TAG" "trainmeet-id:$TAG" "trainmeet-idapi:$TAG" | gzip | $SSH "$TARGET" 'gunzip | docker load'
          cat deploy/testmiljo/compose.yaml | $SSH "$TARGET" 'cat > /srv/trainmeet/compose.yaml'
          cat deploy/testmiljo/Caddyfile | $SSH "$TARGET" 'cat > /srv/trainmeet/Caddyfile'
          cat deploy/testmiljo/catalog-backup.sh | $SSH "$TARGET" 'cat > /srv/trainmeet/catalog-backup.sh'
          # Catalogs hemligheter går direkt från Secret Manager till servern och skrivs aldrig ut.
          $SSH "$TARGET" 'umask 077; cat > /srv/trainmeet/catalog.env' < "$CATALOG_ENV"
          $SSH "$TARGET" 'umask 077; cat > /srv/trainmeet/id.env' < "$ID_ENV"
          # Mejlnyckeln (#66) går från GitHub direkt till ID:s valv på servern och skrivs aldrig ut.
          if [ -n "$TEM_SECRET_KEY" ]; then
            printf '%s' "$TEM_SECRET_KEY" | $SSH "$TARGET" 'umask 077; mkdir -p /srv/trainmeet/id-vault && cat > /srv/trainmeet/id-vault/trainmeet_smtp-password'
          fi
          # Apples push-nyckel (F20) går från GitHub direkt till testhubbens miljö på servern och
          # skrivs aldrig ut. Utan den går notiserna till låtsad push.
          {
            if [ -n "$APNS_KEY_ID" ] && [ -n "$APNS_TEAM_ID" ] && [ -n "$APNS_TOPIC" ] && [ -n "$APNS_KEY" ]; then
              echo "TRAINMEET_APNS_KEY_ID=$APNS_KEY_ID"
              echo "TRAINMEET_APNS_TEAM_ID=$APNS_TEAM_ID"
              echo "TRAINMEET_APNS_TOPIC=$APNS_TOPIC"
              printf 'TRAINMEET_APNS_KEY=%s\n' "$(printf '%s\n' "$APNS_KEY" | awk 'BEGIN { ORS = "\\n" } { print }')"
            fi
          } | $SSH "$TARGET" 'umask 077; cat > /srv/trainmeet/hub-push.env'
          # The tags' final address once trainmeet.app points here, else Catalog's own (C38).
          TAG_BASE="https://$CATALOG_DOMAIN/t/"
          if [ "$(getent ahostsv4 "$TAGS_DOMAIN" | awk 'NR==1{print $1}' || true)" = "$IP" ]; then
            TAG_BASE="https://$TAGS_DOMAIN/t/"
          fi
          $SSH "$TARGET" 'sh -s' -- "$TAG" "$DOMAIN" "$CATALOG_DOMAIN" "$ID_DOMAIN" "$TAGS_DOMAIN" "$TAG_BASE" "$PI_DOMAIN" < deploy/testmiljo/up.sh

      - name: Prova adressen
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
        run: |
          PEKAR=$(getent ahostsv4 "$DOMAIN" | awk 'NR==1{print $1}' || true)
          if [ "$PEKAR" != "$IP" ]; then
            echo "::warning::$DOMAIN pekar inte på servern än ($IP). Lägg in DNS-raden i Cloudflare."
            {
              echo "### Hubben är ute, men adressen saknas"
              echo ""
              echo "Lägg in en DNS-rad i Cloudflare: typ **A**, namn **${DOMAIN%%.trainmeet.app}**, innehåll **$IP**, proxy **av** (grått moln)."
              echo "Kör sedan jobbet igen, eller vänta till nästa ihopslagning."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 36); do
            # Caddy waits longer and longer between certificate attempts while DNS is missing.
            # Once DNS points here, one restart makes it try again at once.
            if [ "$i" = 7 ]; then $SSH "$TARGET" 'cd /srv/trainmeet && docker compose restart caddy'; fi
            if curl -fsS "https://$DOMAIN/api/version" | grep -q "\"commit\":\"$TAG\""; then
              {
                echo "### Testhubben är ute"
                echo ""
                echo "- https://$DOMAIN"
                echo "- Ändring: ${PR:+#$PR }$TITLE"
                echo "- Server: $IP"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$DOMAIN svarar inte med den nya versionen."
          exit 1

      - name: Prova Catalogs adress
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
        run: |
          PEKAR=$(getent ahostsv4 "$CATALOG_DOMAIN" | awk 'NR==1{print $1}' || true)
          if [ "$PEKAR" != "$IP" ]; then
            echo "::warning::$CATALOG_DOMAIN pekar inte på servern än. Lägg in DNS-raden i Cloudflare."
            {
              echo "### Catalog är ute, men adressen saknas"
              echo ""
              echo "Lägg in en DNS-rad i Cloudflare: typ **CNAME**, namn **${CATALOG_DOMAIN%%.trainmeet.app}**, mål **$DOMAIN**, proxy **av** (grått moln)."
              echo "Kör sedan jobbet igen, eller vänta till nästa ihopslagning."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 36); do
            if [ "$i" = 7 ]; then $SSH "$TARGET" 'cd /srv/trainmeet && docker compose restart caddy'; fi
            if curl -fsS "https://$CATALOG_DOMAIN/api/version" | grep -q "\"commit\":\"$TAG\""; then
              {
                echo "### Catalog är ute"
                echo ""
                echo "- https://$CATALOG_DOMAIN"
                echo "- Ändring: ${PR:+#$PR }$TITLE"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$CATALOG_DOMAIN svarar inte med den nya versionen."
          exit 1

      - name: Prova ID:s adress
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
        run: |
          PEKAR=$(getent ahostsv4 "$ID_DOMAIN" | awk 'NR==1{print $1}' || true)
          if [ "$PEKAR" != "$IP" ]; then
            echo "::warning::$ID_DOMAIN pekar inte på servern än. Lägg in DNS-raden i Cloudflare."
            {
              echo "### TrainMeet ID är ute, men adressen saknas"
              echo ""
              echo "Lägg in en DNS-rad i Cloudflare: typ **CNAME**, namn **${ID_DOMAIN%%.trainmeet.app}**, mål **$DOMAIN**, proxy **av** (grått moln)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 36); do
            if [ "$i" = 7 ]; then $SSH "$TARGET" 'cd /srv/trainmeet && docker compose restart caddy'; fi
            if curl -fsS "https://$ID_DOMAIN/realms/trainmeet/.well-known/openid-configuration" | grep -q "\"issuer\":\"https://$ID_DOMAIN/realms/trainmeet\"" &&
              curl -fsS "https://$ID_DOMAIN/api/version" | grep -q "\"commit\":\"$TAG\""; then
              {
                echo "### TrainMeet ID är ute"
                echo ""
                echo "- https://$ID_DOMAIN"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$ID_DOMAIN svarar inte."
          exit 1

      - name: Prova Låtsas-Pi:ns adress
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
        run: |
          PEKAR=$(getent ahostsv4 "$PI_DOMAIN" | awk 'NR==1{print $1}' || true)
          if [ "$PEKAR" != "$IP" ]; then
            echo "::warning::$PI_DOMAIN pekar inte på servern än. Lägg in DNS-raden i Cloudflare."
            {
              echo "### Låtsas-Pi är ute, men adressen saknas"
              echo ""
              echo "Lägg in en DNS-rad i Cloudflare: typ **CNAME**, namn **${PI_DOMAIN%%.trainmeet.app}**, mål **$DOMAIN**, proxy **av** (grått moln)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 36); do
            if [ "$i" = 7 ]; then $SSH "$TARGET" 'cd /srv/trainmeet && docker compose restart caddy'; fi
            if curl -fsS "https://$PI_DOMAIN/api/version" | grep -q "\"commit\":\"$TAG\""; then
              {
                echo "### Låtsas-Pi är ute"
                echo ""
                echo "- https://$PI_DOMAIN"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$PI_DOMAIN svarar inte."
          exit 1

      - name: Prova taggarnas adress
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
        run: |
          PEKAR=$(getent ahostsv4 "$TAGS_DOMAIN" | awk 'NR==1{print $1}' || true)
          if [ "$PEKAR" != "$IP" ]; then
            echo "::warning::$TAGS_DOMAIN pekar inte på servern än. Lägg in DNS-raden i Cloudflare."
            {
              echo "### Taggarnas adress saknas"
              echo ""
              echo "Lägg in en DNS-rad i Cloudflare för zonen **$TAGS_DOMAIN**: typ **CNAME**, namn **@**, mål **$DOMAIN**, proxy **av** (grått moln)."
              echo "Till dess har taggarna Catalogs adress i testmiljön."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # /t/<uid> goes on to Catalog in the test environment until production exists (C38).
          for i in $(seq 1 36); do
            if [ "$i" = 7 ]; then $SSH "$TARGET" 'cd /srv/trainmeet && docker compose restart caddy'; fi
            WHERE=$(curl -fsS -o /dev/null -w '%{redirect_url}' "https://$TAGS_DOMAIN/t/prov" || true)
            if [ "$WHERE" = "https://$CATALOG_DOMAIN/t/prov" ]; then
              {
                echo "### Taggarnas adress svarar"
                echo ""
                echo "- https://$TAGS_DOMAIN/t/ går vidare till https://$CATALOG_DOMAIN/t/"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$TAGS_DOMAIN/t/ går inte vidare till Catalog."
          exit 1

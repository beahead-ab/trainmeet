# Körs på varje PR och varje ändring på main: kodstil, typer, testerna, Hubbens bild och
# Catalogs bild. Alla tre kontrollerna, "Tester", "Hubbens bild" och "Catalogs bild", ska
# vara gröna innan en PR slås ihop.
name: Tester

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tester-${{ github.ref }}
  # A newer push replaces an older test run on a PR, but a run on main is never cut off:
  # it may be in the middle of putting the hub out in the test environment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tester:
    name: Tester
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # TrainMeet Catalog's tests need a PostgreSQL of their own (catalog/tests/conftest.py).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: prov
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      CATALOG_TEST_DATABASE_URL: postgresql://postgres:prov@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Installera
        run: uv sync --locked

      - name: Kodstil
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Typer
        run: uv run mypy

      - name: Testerna
        run: uv run pytest

      - name: Kontraktens TypeScript-typer
        run: |
          npx --yes openapi-typescript@7.10.1 contracts/openapi.json -o contracts/types.d.ts --check
          npx --yes openapi-typescript@7.10.1 contracts/catalog.openapi.json -o contracts/catalog.d.ts --check

  bilden:
    name: Hubbens bild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Bygg bilden
        run: >
          docker build -f hub/Dockerfile -t trainmeet-hub:prov
          --build-arg TRAINMEET_COMMIT=${{ github.sha }} .

      - name: Starta bilden och prova sidorna
        run: |
          docker run -d --name hub -p 8080:8080 trainmeet-hub:prov
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/ | grep -q "Öppna Provbanan"
          curl -fsS http://localhost:8080/provbanan | grep -q "Starta provkörning"
          curl -fsS -H 'Content-Type: application/json' -d '{"version":1}' \
            http://localhost:8080/api/provbanan/start | grep -q '"meet_id":"provbanan"'
          curl -fsS http://localhost:8080/api/version | grep -q '"product":"TrainMeet Hub"'
          curl -fsS -o /dev/null http://localhost:8080/static/skylt.svg
          curl -fsS -o /dev/null http://localhost:8080/static/fonts/inter.woff2
          docker inspect --format '{{.Config.User}}' hub | grep -qx hub

      - name: Visa loggen om något gick fel
        if: failure()
        run: docker logs hub || true

  # TrainMeet Catalog: webbappens typer och tester körs när bilden byggs. Sedan provas bilden
  # med testmiljöns egen compose-fil: databasen, säkerhetskopian före migreringen, migreringen,
  # Catalog i läget check, provinloggningen och en säkerhetskopia med data i (CAT-39).
  catalog:
    name: Catalogs bild
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROV: /tmp/catalog-testmiljo
    steps:
      - uses: actions/checkout@v4

      - name: Bygg bilden
        run: >
          docker build -f catalog/Dockerfile -t trainmeet-catalog:prov
          --build-arg TRAINMEET_COMMIT=${{ github.sha }} .

      - name: Starta databasen som i testmiljön
        run: |
          mkdir -p "$PROV"
          cp deploy/testmiljo/compose.yaml deploy/testmiljo/catalog-backup.sh "$PROV/"
          cd "$PROV"
          umask 077
          {
            echo "HUB_TAG=prov"
            echo "HUB_DOMAIN=localhost"
            echo "CATALOG_TAG=prov"
            echo "CATALOG_DOMAIN=localhost"
            echo "CATALOG_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "CATALOG_BACKUP_KEY=$(openssl rand -hex 32)"
          } > .env
          docker compose up -d --wait catalog-db

      - name: Säkerhetskopian före migreringen, migreringen och Catalog
        run: |
          cd "$PROV"
          # Catalog vägrar starta mot en databas som inte är migrerad.
          if UT=$(timeout 60 docker compose run --rm --no-deps catalog 2>&1); then
            echo "::error::Catalog startade mot en omigrerad databas."; exit 1
          fi
          echo "$UT" | grep -q "saknar migrationer"
          TESTMILJO_DIR="$PROV" sh catalog-backup.sh fore-migrering
          docker compose run --rm --no-deps catalog python -m catalog.migrate
          docker compose run --rm --no-deps catalog python -m catalog.migrate --check
          docker compose up -d --no-deps catalog

      - name: Prova Catalog
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8081/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8081/healthz | grep -qx ok
          curl -fsS http://localhost:8081/api/version | grep -q '"product":"TrainMeet Catalog"'
          curl -fsS http://localhost:8081/api/version | grep -q '"commit":"${{ github.sha }}"'
          curl -fsS http://localhost:8081/ | grep -q "<title>TrainMeet Catalog</title>"
          curl -fsS http://localhost:8081/fordon | grep -q 'id="root"'
          curl -fsS -o /dev/null http://localhost:8081/manifest.webmanifest
          curl -fsS -I http://localhost:8081/fordon | grep -qi "content-security-policy: default-src 'self'"
          curl -fsS http://localhost:8081/api/catalog/1/session | grep -q '"login":"trial"'
          ACCOUNT=$(curl -fsS http://localhost:8081/api/catalog/1/trial/accounts | jq -r '.[0].id')
          curl -fsS -c "$PROV/kakor" -H 'Content-Type: application/json' -d "{\"account\":\"$ACCOUNT\"}" \
            http://localhost:8081/api/catalog/1/trial/login | grep -q '"name":"Provkonto A"'
          curl -fsS -b "$PROV/kakor" http://localhost:8081/api/catalog/1/session | grep -q '"name":"Provkonto A"'
          # En simulerad tagg, som i testmiljön: okänd tills den kopplas (#54).
          UID=$(curl -fsS -b "$PROV/kakor" -X POST http://localhost:8081/api/catalog/1/tags/simulated | jq -r .uid)
          curl -fsS -b "$PROV/kakor" "http://localhost:8081/api/catalog/1/tags/$UID" | grep -q '"outcome":"unknown"'
          curl -fsS "http://localhost:8081/t/$UID" | grep -q 'id="root"'
          docker inspect --format '{{.Config.User}}' "$(docker compose -f "$PROV/compose.yaml" ps -q catalog)" | grep -qx catalog

      - name: Nattens säkerhetskopia, med data i
        run: |
          cd "$PROV"
          TESTMILJO_DIR="$PROV" sh catalog-backup.sh natt
          ls catalog-backup/*-natt.dump.enc catalog-backup/*-fore-migrering.dump.enc
          # Krypterad: pg_dumps eget huvud (PGDMP) syns inte i filen.
          if head -c 5 catalog-backup/*-natt.dump.enc | grep -q PGDMP; then exit 1; fi

      - name: Visa loggen om något gick fel
        if: failure()
        run: cd "$PROV" && docker compose logs || true

  # Lägger ut hubben på test.hub.trainmeet.app när en ändring har slagits ihop med main
  # och båda kontrollerna är gröna. Servern skapas första gången (deploy/testmiljo.py).
  testmiljon:
    name: Testmiljön
    needs: [tester, bilden, catalog]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: testmiljon
      cancel-in-progress: false
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      TESTMILJO_TYPE: ${{ vars.TESTMILJO_TYPE }}
      DOMAIN: ${{ vars.TESTHUB_DOMAIN || 'test.hub.trainmeet.app' }}
      CATALOG_DOMAIN: ${{ vars.TESTCATALOG_DOMAIN || 'test.catalog.trainmeet.app' }}
      TAG: ${{ github.sha }}
    steps:
      - name: Finns Scaleway-nyckeln?
        id: nyckel
        run: |
          if [ -n "$SCW_SECRET_KEY" ] && [ -n "$SCW_ACCESS_KEY" ] && [ -n "$SCW_DEFAULT_PROJECT_ID" ] && [ -n "$SCW_DEFAULT_ORGANIZATION_ID" ]; then
            echo "finns=true" >> "$GITHUB_OUTPUT"
          else
            echo "finns=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Testmiljön väntar på Scaleway-nyckeln. Lägg in SCW_ACCESS_KEY, SCW_SECRET_KEY, SCW_DEFAULT_PROJECT_ID och SCW_DEFAULT_ORGANIZATION_ID under Settings → Secrets and variables → Actions."
            {
              echo "### Testmiljön väntar på Scaleway-nyckeln"
              echo ""
              echo "Lägg in de fyra secrets som står i README under *Testmiljön*, och kör sedan jobbet igen under Actions."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.nyckel.outputs.finns == 'true'

      - uses: astral-sh/setup-uv@v6
        if: steps.nyckel.outputs.finns == 'true'
        with:
          enable-cache: true

      - name: Vilken ändring är det?
        if: steps.nyckel.outputs.finns == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh api "repos/${{ github.repository }}/commits/$TAG/pulls" --jq '.[0].number // empty' || true)
          TITLE=$(gh api "repos/${{ github.repository }}/commits/$TAG/pulls" --jq '.[0].title // empty' || true)
          if [ -z "$TITLE" ]; then TITLE=$(git log -1 --format=%s "$TAG"); fi
          echo "PR=$PR" >> "$GITHUB_ENV"
          {
            echo "TITLE<<TITEL_SLUT"
            echo "$TITLE"
            echo "TITEL_SLUT"
          } >> "$GITHUB_ENV"
          echo "BUILT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Bygg bilderna
        if: steps.nyckel.outputs.finns == 'true'
        run: |
          for part in hub catalog; do
            docker build -f "$part/Dockerfile" -t "trainmeet-$part:$TAG" \
              --build-arg TRAINMEET_COMMIT="$TAG" \
              --build-arg TRAINMEET_PR="$PR" \
              --build-arg TRAINMEET_TITLE="$TITLE" \
              --build-arg TRAINMEET_BUILT="$BUILT" .
          done

      - name: Servern hos Scaleway
        id: server
        if: steps.nyckel.outputs.finns == 'true'
        run: |
          uv sync --locked
          uv run python deploy/testmiljo.py ensure

      - name: Vänta tills servern är uppsatt
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
          SSH_USER: ${{ steps.server.outputs.user }}
          KEY: ${{ steps.server.outputs.key_file }}
          KNOWN: ${{ steps.server.outputs.known_hosts }}
          CATALOG_ENV: ${{ steps.server.outputs.catalog_env }}
        run: |
          echo "CATALOG_ENV=$CATALOG_ENV" >> "$GITHUB_ENV"
          SSH="ssh -i $KEY -o UserKnownHostsFile=$KNOWN -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -o BatchMode=yes"
          echo "SSH=$SSH" >> "$GITHUB_ENV"
          echo "TARGET=$SSH_USER@$IP" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            $SSH "$SSH_USER@$IP" true 2>/dev/null && break
            sleep 5
          done
          $SSH "$SSH_USER@$IP" '
            set -e
            status=0
            cloud-init status --wait || status=$?
            # Exit 2 means cloud-init finished with recoverable errors.
            case "$status" in
              0|2) ;;
              *) exit "$status" ;;
            esac
            test -w /srv/trainmeet
            docker info >/dev/null
            docker compose version --short
          '

      - name: Lägg ut hubben och Catalog
        if: steps.nyckel.outputs.finns == 'true'
        run: |
          docker save "trainmeet-hub:$TAG" "trainmeet-catalog:$TAG" | gzip | $SSH "$TARGET" 'gunzip | docker load'
          cat deploy/testmiljo/compose.yaml | $SSH "$TARGET" 'cat > /srv/trainmeet/compose.yaml'
          cat deploy/testmiljo/Caddyfile | $SSH "$TARGET" 'cat > /srv/trainmeet/Caddyfile'
          cat deploy/testmiljo/catalog-backup.sh | $SSH "$TARGET" 'cat > /srv/trainmeet/catalog-backup.sh'
          # Catalogs hemligheter går direkt från Secret Manager till servern och skrivs aldrig ut.
          $SSH "$TARGET" 'umask 077; cat > /srv/trainmeet/catalog.env' < "$CATALOG_ENV"
          $SSH "$TARGET" 'sh -s' -- "$TAG" "$DOMAIN" "$CATALOG_DOMAIN" < deploy/testmiljo/up.sh

      - name: Prova adressen
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
        run: |
          PEKAR=$(getent ahostsv4 "$DOMAIN" | awk 'NR==1{print $1}' || true)
          if [ "$PEKAR" != "$IP" ]; then
            echo "::warning::$DOMAIN pekar inte på servern än ($IP). Lägg in DNS-raden i Cloudflare."
            {
              echo "### Hubben är ute, men adressen saknas"
              echo ""
              echo "Lägg in en DNS-rad i Cloudflare: typ **A**, namn **${DOMAIN%%.trainmeet.app}**, innehåll **$IP**, proxy **av** (grått moln)."
              echo "Kör sedan jobbet igen, eller vänta till nästa ihopslagning."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 36); do
            # Caddy waits longer and longer between certificate attempts while DNS is missing.
            # Once DNS points here, one restart makes it try again at once.
            if [ "$i" = 7 ]; then $SSH "$TARGET" 'cd /srv/trainmeet && docker compose restart caddy'; fi
            if curl -fsS "https://$DOMAIN/api/version" | grep -q "\"commit\":\"$TAG\""; then
              {
                echo "### Testhubben är ute"
                echo ""
                echo "- https://$DOMAIN"
                echo "- Ändring: ${PR:+#$PR }$TITLE"
                echo "- Server: $IP"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$DOMAIN svarar inte med den nya versionen."
          exit 1

      - name: Prova Catalogs adress
        if: steps.nyckel.outputs.finns == 'true'
        env:
          IP: ${{ steps.server.outputs.ip }}
        run: |
          PEKAR=$(getent ahostsv4 "$CATALOG_DOMAIN" | awk 'NR==1{print $1}' || true)
          if [ "$PEKAR" != "$IP" ]; then
            echo "::warning::$CATALOG_DOMAIN pekar inte på servern än. Lägg in DNS-raden i Cloudflare."
            {
              echo "### Catalog är ute, men adressen saknas"
              echo ""
              echo "Lägg in en DNS-rad i Cloudflare: typ **CNAME**, namn **${CATALOG_DOMAIN%%.trainmeet.app}**, mål **$DOMAIN**, proxy **av** (grått moln)."
              echo "Kör sedan jobbet igen, eller vänta till nästa ihopslagning."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for i in $(seq 1 36); do
            if [ "$i" = 7 ]; then $SSH "$TARGET" 'cd /srv/trainmeet && docker compose restart caddy'; fi
            if curl -fsS "https://$CATALOG_DOMAIN/api/version" | grep -q "\"commit\":\"$TAG\""; then
              {
                echo "### Catalog är ute"
                echo ""
                echo "- https://$CATALOG_DOMAIN"
                echo "- Ändring: ${PR:+#$PR }$TITLE"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$CATALOG_DOMAIN svarar inte med den nya versionen."
          exit 1

# Provet av webbsökningen med den riktiga nyckeln (CAT-172, C40): startas bara för hand, aldrig
# av ett PR eller av main (beslut 22 november). Det söker på riktigt hos Anthropic, ungefär
# 0,15 dollar per fall, med nyckeln ANTHROPIC_API_KEY_SEARCH. Nyckeln skrivs till en fil som
# bara det här steget läser, och tas bort efteråt; den skrivs aldrig ut.
#
# ID:s prov (id/prov_webbsokning.py) sparar varje fall, och Catalogs prov
# (catalog/prov_webbsokning.py) kontrollerar belägget per fält på samma svar. Sammanfattningen
# står under körningen, och hela rapporten, med värdena, utdragen och adresserna, står i loggen
# och i filen prov-webbsokning. Det är bara det sökningen hittade på öppna sidor och märkningen.
#
# Med korning (numret i en tidigare körnings adress) söks inget: fallen hämtas från den
# körningen, värdena läses om med mätarens läsning som den är nu och kontrolleras igen, till
# exempel efter en ändring i mätaren eller i Catalogs regler. Det kostar ingenting.
name: Prov av webbsökningen

on:
  workflow_dispatch:
    inputs:
      fall:
        description: "Vilka fall: alla, eller numren med komma, till exempel 1,6"
        required: true
        default: alla
      korning:
        description: "Kontrollera igen fallen från en tidigare körning, utan att söka: körningens nummer"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: prov-webbsokning
  cancel-in-progress: false

jobs:
  prov:
    name: Prov av webbsökningen
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Installera
        run: uv sync --locked

      - name: Sök
        if: ${{ inputs.korning == '' }}
        env:
          ANTHROPIC_API_KEY_SEARCH: ${{ secrets.ANTHROPIC_API_KEY_SEARCH }}
          FALL: ${{ inputs.fall }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY_SEARCH" ]; then
            echo "::error::ANTHROPIC_API_KEY_SEARCH saknas i repots hemligheter."
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/trainmeet_search-key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$ANTHROPIC_API_KEY_SEARCH" > "$key"
          uv run python -m id.prov_webbsokning --fall "$FALL" --spara prov --nyckelfil "$key"

      - name: Hämta fallen från en tidigare körning
        if: ${{ inputs.korning != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          KORNING: ${{ inputs.korning }}
        run: |
          if ! [[ "$KORNING" =~ ^[0-9]{1,20}$ ]]; then
            echo "::error::korning är numret i körningens adress, bara siffror."
            exit 1
          fi
          gh run download "$KORNING" --repo "$GITHUB_REPOSITORY" --name prov-webbsokning --dir prov
          rm -f prov/rapport.md
          uv run python -m id.prov_webbsokning --igen prov

      - name: Catalogs kontroll av belägget
        if: ${{ !cancelled() && hashFiles('prov/*.json') != '' }}
        run: |
          uv run python -m catalog.prov_webbsokning prov --rapport prov/rapport.md \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo
          echo "Hela rapporten:"
          cat prov/rapport.md

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && hashFiles('prov/*.json') != '' }}
        with:
          name: prov-webbsokning
          path: prov/
          retention-days: 30

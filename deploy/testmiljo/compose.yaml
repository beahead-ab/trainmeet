# Testmiljön på servern, i /srv/trainmeet. Läggs dit av jobbet "Testmiljön" vid varje
# ändring på main, tillsammans med Caddyfile, catalog-backup.sh och en .env med taggarna,
# adresserna och hemligheterna (catalog.env och id.env). Mejlnyckeln ligger i id-vault/.
# Hubben, Catalog och TrainMeet ID delar server och Caddy, men inget annat (C35, CAT-218).
services:
  hub:
    image: trainmeet-hub:${HUB_TAG:?HUB_TAG saknas}
    restart: unless-stopped
    environment:
      TRAINMEET_HUB_NAME: Testhubben
      TRAINMEET_PREVIEW_DB: /data/provbanan.sqlite3
      # Only Caddy talks to the hub; trust its X-Forwarded-* headers.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./hub-data:/data
    ports:
      # Reachable from the server itself for the deploy check, never from outside.
      - "127.0.0.1:8080:8080"

  # TrainMeet Catalog's own PostgreSQL. No port outside: only Catalog reaches it, on
  # compose's own network. The data lives in the volume catalog-db.
  catalog-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?CATALOG_DB_PASSWORD saknas}
    volumes:
      - catalog-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 3s
      retries: 30

  catalog:
    image: trainmeet-catalog:${CATALOG_TAG:?CATALOG_TAG saknas}
    restart: unless-stopped
    depends_on:
      catalog-db:
        condition: service_healthy
    environment:
      CATALOG_DATABASE_URL: postgresql://catalog:${CATALOG_DB_PASSWORD}@catalog-db:5432/catalog
      # The database is migrated by up.sh after the backup; Catalog only checks it (CAT-39).
      CATALOG_MIGRATE: check
      # The trial login, until TrainMeet ID can send its codes (C21, CAT-214): up.sh turns it
      # off when ID has its mail key. Only in the test environment.
      CATALOG_TRIAL_LOGIN: ${CATALOG_TRIAL_LOGIN:?CATALOG_TRIAL_LOGIN saknas}
      # The login with TrainMeet ID (#66, KONTO-27). The browser goes to ID's address, and
      # Catalog itself reaches ID next to it.
      CATALOG_ID_ISSUER: https://${ID_DOMAIN}/realms/trainmeet
      CATALOG_ID_INTERNAL: http://id:8080/realms/trainmeet
      CATALOG_ID_SECRET: ${ID_CATALOG_SECRET}
      CATALOG_PUBLIC_URL: https://${CATALOG_DOMAIN}
      # ID's API, which Catalog asks about shared fleets at every call (#49, KONTO-34).
      CATALOG_ID_API: http://id-api:8080
      # The test environment's tags point here, so they can be tapped here, and simulated tags
      # try the flows without hardware (CAT-96). Real tags carry trainmeet.app/t/ (C9).
      # trainmeet.app/t/ once its DNS row points here, else Catalog's own address (C38).
      CATALOG_TAG_BASE: ${CATALOG_TAG_BASE:?CATALOG_TAG_BASE saknas}
      CATALOG_SIMULATED_TAGS: "on"
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:8081:8080"

  # TrainMeet ID: Keycloak with the code to the email (#66, ID4, ID5), and its own PostgreSQL.
  id-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${ID_DB_PASSWORD:?ID_DB_PASSWORD saknas}
    volumes:
      - id-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 30

  id:
    image: trainmeet-id:${ID_TAG:?ID_TAG saknas}
    restart: unless-stopped
    # Runs as the deploy user, so it can read the mail key in id-vault, which only it may read.
    user: "${HOST_UID:?HOST_UID saknas}:0"
    depends_on:
      id-db:
        condition: service_healthy
    # Keycloak takes most of the memory it is given; the server is shared.
    mem_limit: 900m
    environment:
      KC_DB_URL: jdbc:postgresql://id-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${ID_DB_PASSWORD}
      KC_HOSTNAME: https://${ID_DOMAIN:?ID_DOMAIN saknas}
      KC_BOOTSTRAP_ADMIN_USERNAME: tm-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ID_ADMIN_PASSWORD:?ID_ADMIN_PASSWORD saknas}
      # Scaleway's Transactional Email, from trainmeet.se. The key is in the vault.
      ID_SMTP_HOST: smtp.tem.scaleway.com
      ID_SMTP_PORT: "465"
      ID_SMTP_SSL: "true"
      ID_SMTP_STARTTLS: "false"
      ID_SMTP_AUTH: "true"
      ID_SMTP_USER: ${TEM_PROJECT_ID:-}
      ID_SMTP_FROM: konto@trainmeet.se
      ID_CATALOG_SECRET: ${ID_CATALOG_SECRET:?ID_CATALOG_SECRET saknas}
      ID_CATALOG_URL: https://${CATALOG_DOMAIN}
      # ID's own web app (#67), a client of its own in the realm.
      ID_APP_SECRET: ${ID_APP_SECRET:?ID_APP_SECRET saknas}
      ID_PUBLIC_URL: https://${ID_DOMAIN}
    volumes:
      - ./id-vault:/opt/keycloak/vault:ro
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:9082:9000"

  # ID's API and web app (#67): clubs, members and the roles per resource, beside Keycloak at
  # the same address. Its own database, idapi, in ID's PostgreSQL; up.sh makes it.
  id-api:
    image: trainmeet-idapi:${ID_TAG}
    restart: unless-stopped
    # Reads the mail key in id-vault for the invitations, like Keycloak.
    user: "${HOST_UID}:0"
    depends_on:
      id-db:
        condition: service_healthy
    environment:
      ID_API_DATABASE_URL: postgresql://keycloak:${ID_DB_PASSWORD}@id-db:5432/idapi
      ID_API_ISSUER: https://${ID_DOMAIN}/realms/trainmeet
      ID_API_INTERNAL: http://id:8080/realms/trainmeet
      ID_API_SECRET: ${ID_APP_SECRET}
      ID_API_PUBLIC_URL: https://${ID_DOMAIN}
      ID_API_APPS: catalog
      ID_SMTP_HOST: smtp.tem.scaleway.com
      ID_SMTP_PORT: "465"
      ID_SMTP_SSL: "true"
      ID_SMTP_STARTTLS: "false"
      ID_SMTP_AUTH: "true"
      ID_SMTP_USER: ${TEM_PROJECT_ID:-}
      ID_SMTP_FROM: konto@trainmeet.se
      ID_SMTP_PASSWORD_FILE: /vault/trainmeet_smtp-password
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - ./id-vault:/vault:ro
    ports:
      - "127.0.0.1:8083:8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - hub
      - catalog
      - id
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN:?HUB_DOMAIN saknas}
      CATALOG_DOMAIN: ${CATALOG_DOMAIN:?CATALOG_DOMAIN saknas}
      ID_DOMAIN: ${ID_DOMAIN:?ID_DOMAIN saknas}
      TAGS_DOMAIN: ${TAGS_DOMAIN:?TAGS_DOMAIN saknas}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
  catalog-db:
  id-db:

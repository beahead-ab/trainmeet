[project]
name = "trainmeet"
version = "0.1.0"
description = "TrainMeet, nästa generation: Hubben, kontrakten och delarna."
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "paho-mqtt>=2.1,<3",
    "pdfminer-six>=20250506",
    "pydantic>=2.9",
    "segno>=1.6.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
# TrainMeet Catalog's own server (catalog/): PostgreSQL through psycopg (CAT-35). Not in the hub's image.
catalog = [
    # Signs the pictures' requests to Object Storage with AWS's own SigV4 (CAT-130).
    "botocore>=1.35",
    # Talks to TrainMeet ID: the token exchange, and the ID token's signature (KONTO-10).
    "httpx>=0.27",
    # Reads the vehicles' pictures, strips their metadata and makes the sizes (CAT-123–CAT-126).
    "pillow>=11",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.10",
]
# TrainMeet ID's own API (id/, #67): PostgreSQL, Keycloak's tokens and keys. Not in the hub's image.
id = [
    "botocore>=1.35",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.10",
]
# Push to Apple's service (F20, synk/push.py): HTTP/2 and the signed token. In the hub's image.
push = [
    "httpx[http2]>=0.27",
    "pyjwt[crypto]>=2.10",
]
# TrainMeet TKL (tkl/, KLAR-22): talks to the hub's station protocol, and finds the hub on the
# meet's network with DNS-SD (KLAR-13). Not in the hub's image.
tkl = [
    "httpx>=0.27",
    # Checks the ID token when TKL logs in with TrainMeet ID (TKL18, #78).
    "pyjwt[crypto]>=2.10",
    "zeroconf>=0.136",
]
dev = [
    "httpx>=0.27",
    # Checks the examples against the published JSON Schemas, as other readers will.
    "jsonschema>=4.23",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    # Scaleway's official SDK, for the test environment (deploy/testmiljo.py).
    "scaleway>=2.12",
]

[tool.uv]
default-groups = ["dev", "catalog", "id", "push", "tkl"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One package per part. New parts (contracts, core, drift, ...) are added here as they are built.
packages = [
    "catalog",
    "contracts",
    "core",
    "drift",
    "hub",
    "id",
    "integrationer",
    "planering",
    "synk",
    "tkl",
]
exclude = [
    "**/tests",
    "hub/Dockerfile",
    "catalog/Dockerfile",
    "id/Dockerfile",
    "id/api.Dockerfile",
    "id/email-code",
    "id/realm",
    "tkl/Dockerfile",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Swedish typography is intended: 5×7, tankstreck (–).
allowed-confusables = ["×", "–"]

[tool.ruff.lint.per-file-ignores]
# The TMBox texts: one row per text, five languages side by side.
"drift/terminal_text.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["catalog", "contracts", "core", "drift", "hub", "id", "integrationer", "planering", "synk", "tkl", "deploy", "tests"]

[[tool.mypy.overrides]]
# These have type hints but no py.typed marker.
module = ["scaleway", "scaleway.*", "jsonschema", "jsonschema.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
# AWS's own signing, for Claude in Amazon Bedrock (id/meter.py) and for the pictures in
# Object Storage (catalog/pictures.py), has no type hints.
module = ["botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = [
    "tests",
    "catalog",
    "contracts",
    "core",
    "drift",
    "hub",
    "id",
    "integrationer",
    "planering",
    "synk",
    "tkl",
]
pythonpath = ["."]
filterwarnings = [
    "error",
    # Starlette's test client still works with httpx; the hint about another package is noise.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

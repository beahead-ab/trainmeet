[project]
name = "trainmeet"
version = "0.1.0"
description = "TrainMeet, nästa generation: Hubben, kontrakten och delarna."
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    # Checks the examples against the published JSON Schemas, as other readers will.
    "jsonschema>=4.23",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    # Scaleway's official SDK, for the test environment (deploy/testmiljo.py).
    "scaleway>=2.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One package per part. New parts (contracts, core, drift, ...) are added here as they are built.
packages = ["contracts", "drift", "hub"]
exclude = ["**/tests", "hub/Dockerfile"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Swedish typography is intended: 5×7, tankstreck (–).
allowed-confusables = ["×", "–"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["contracts", "drift", "hub", "deploy", "tests"]

[[tool.mypy.overrides]]
# These have type hints but no py.typed marker.
module = ["scaleway", "scaleway.*", "jsonschema", "jsonschema.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = ["tests", "contracts", "drift", "hub"]
pythonpath = ["."]
filterwarnings = [
    "error",
    # Starlette's test client still works with httpx; the hint about another package is noise.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[project]
name = "trainmeet"
version = "0.1.0"
description = "TrainMeet, nästa generation: Hubben, kontrakten och delarna."
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "segno>=1.6.6",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
# TrainMeet Catalog's own server (catalog/): PostgreSQL through psycopg (CAT-35). Not in the hub's image.
catalog = [
    # Talks to TrainMeet ID: the token exchange, and the ID token's signature (KONTO-10).
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.10",
]
# TrainMeet ID's own API (id/, #67): PostgreSQL, Keycloak's tokens and keys. Not in the hub's image.
id = [
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.10",
]
dev = [
    "httpx>=0.27",
    # Checks the examples against the published JSON Schemas, as other readers will.
    "jsonschema>=4.23",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    # Scaleway's official SDK, for the test environment (deploy/testmiljo.py).
    "scaleway>=2.12",
]

[tool.uv]
default-groups = ["dev", "catalog", "id"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# One package per part. New parts (contracts, core, drift, ...) are added here as they are built.
packages = ["catalog", "contracts", "drift", "hub", "id", "integrationer", "planering"]
exclude = [
    "**/tests",
    "hub/Dockerfile",
    "catalog/Dockerfile",
    "id/Dockerfile",
    "id/api.Dockerfile",
    "id/email-code",
    "id/realm",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Swedish typography is intended: 5×7, tankstreck (–).
allowed-confusables = ["×", "–"]

[tool.ruff.lint.per-file-ignores]
# The TMBox texts: one row per text, five languages side by side.
"drift/terminal_text.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["catalog", "contracts", "drift", "hub", "id", "integrationer", "planering", "deploy", "tests"]

[[tool.mypy.overrides]]
# These have type hints but no py.typed marker.
module = ["scaleway", "scaleway.*", "jsonschema", "jsonschema.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -q"
testpaths = ["tests", "catalog", "contracts", "drift", "hub", "id", "integrationer", "planering"]
pythonpath = ["."]
filterwarnings = [
    "error",
    # Starlette's test client still works with httpx; the hint about another package is noise.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
